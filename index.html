- **Destacado**: los alumnos se autorregulan, colaboran entre sí y el docente facilita más que controla.
- *Evidencia*: observación de clase, encuesta a estudiantes, registro de incidentes.

### 4. Trabajo en equipo con colegas
- **Inicial**: trabaja aislado, no comparte materiales ni asiste a reuniones de área con disposición.
- **En desarrollo**: asiste y participa cuando se le pide, pero no propone ni colabora espontáneamente.
- **Competente**: colabora activamente, comparte recursos, acepta y da retroalimentación constructiva.
- **Destacado**: lidera iniciativas conjuntas, mentora a colegas nuevos y facilita la resolución de conflictos en el equipo.
- *Evidencia*: participación en reuniones (actas), proyectos colaborativos, observación entre pares realizada.

### 5. Disposición al cambio y aprendizaje
- **Inicial**: rechaza cambios, no asiste a capacitaciones o asiste sin participar.
- **En desarrollo**: acepta los cambios cuando se le explican, pero no los busca por iniciativa propia.
- **Competente**: busca capacitación, implementa lo aprendido y pide retroalimentación.
- **Destacado**: además propone innovaciones, prueba metodologías nuevas y comparte aprendizajes con el equipo.
- *Evidencia*: asistencia a capacitaciones, implementación de cambios observados en clase, propuestas documentadas.

### 6. Relación con apoderados
- **Inicial**: evita el contacto con apoderados o genera conflictos recurrentes.
- **En desarrollo**: responde cuando lo contactan pero no comunica proactivamente.
- **Competente**: informa periódicamente, maneja reuniones con claridad y escucha las preocupaciones.
- **Destacado**: los apoderados confían en el docente, lo buscan como referente y participan en actividades del área.
- *Evidencia*: registro de comunicaciones, actas de reuniones, encuesta a apoderados, reclamos formales.

## Formato de la matriz (plantilla)

| Docente | Dominio técnico | Planificación | Manejo grupo | Trabajo equipo | Disp. cambio | Rel. apoderados | Promedio | Clasificación |
|---------|:-:|:-:|:-:|:-:|:-:|:-:|:-:|---------------|
| Nombre 1 | 3 | 2 | 3 | 2 | 3 | 2 | 2.5 | En Proyección |
| Nombre 2 | 4 | 3 | 4 | 3 | 3 | 3 | 3.3 | Especialista |
| ... | | | | | | | | |

## Cómo recoger evidencia
- **Observación de clases**: mínimo 2 por semestre con la pauta de observación del área.
- **Entrevista individual**: conversación estructurada de 30 minutos al inicio del año.
- **Revisión documental**: planificaciones, registros de evaluación, informes entregados.
- **Encuesta a estudiantes**: 3 preguntas aplicadas en junio.
- **Datos de resultados**: porcentaje de logro de los alumnos en las rúbricas del perfil del deportista.
- **Nunca con rumores**: si alguien reporta algo de un colega, se verifica con observación directa antes de registrar.

## Conexión con la clasificación Especialista / En Proyección
- **Especialista**: promedio igual o superior a 3.0, con ninguna competencia en nivel Inicial. Tiene experiencia comprobada y puede mentorear a otros.
- **En Proyección**: promedio entre 2.0 y 2.9, con disposición al cambio en nivel Competente o superior. Tiene motivación pero necesita desarrollo.
- **Atención**: promedio inferior a 2.0 o disposición al cambio en nivel Inicial. Requiere plan de mejora con plazo definido.

La mezcla Especialista + En Proyección es deliberada: los especialistas mentorean a los que están en proyección. Se asignan pares de trabajo cruzado.

## Usos de la matriz

### 1. Plan de desarrollo individual
- Cada docente recibe su resultado y acuerda con el jefe 2 competencias foco para el año.
- Se define una acción concreta por competencia (capacitación, observación entre pares, lectura, mentoría).
- Se revisa el avance en julio y se evalúa en noviembre.

### 2. Decisiones de composición del equipo
- Si la matriz muestra que todo el equipo tiene nivel bajo en planificación, la primera capacitación debe ser de planificación.
- Si hay exceso de especialistas en fútbol y déficit en deportes individuales, la próxima contratación prioriza esa área.
- La matriz visual permite ver rápidamente dónde están las fortalezas y las brechas.

### 3. Prioridades de contratación
- Al solicitar un cargo nuevo a rectoría, se usa la matriz para demostrar la brecha: "No tenemos a nadie sobre nivel 2 en deportes de raqueta."
- El perfil del cargo nuevo se diseña para cubrir las competencias que faltan en el equipo.

### 4. Inversión en capacitación
- El presupuesto de capacitación se asigna según las brechas más frecuentes en la matriz, no según preferencias individuales.
- Si 4 de 6 docentes están en nivel Inicial o En desarrollo en uso de datos, se contrata una capacitación grupal en esa competencia.
- Las capacitaciones individuales se reservan para docentes En Proyección con alto potencial.

## Reglas de uso
- La matriz se comparte con cada docente (solo su fila). No se publica el cuadro completo.
- Se actualiza una vez al año (noviembre) con base en la evaluación de cierre.
- Es un instrumento de gestión del jefe de departamento, no un documento punitivo.
- Si un docente mejora de Inicial a Competente en un año, se reconoce públicamente.`},
"perfiles-de-cargo":{title:"Perfiles de cargo del área",sectionId:"03",md:`Definir por escrito antes de cualquier contratación o reestructuración. Cargo que no tiene indicador definido no está bien diseñado. Los perfiles se adaptan al tamaño del colegio, pero la estructura base es la misma.

## 1. Jefe de Departamento de Deportes

**Misión**: dirigir el área deportiva para que cada alumno progrese según el perfil del deportista, gestionando equipo, presupuesto y relación institucional.

**Funciones**:
1. Diseñar y actualizar el plan estratégico del área alineado al proyecto educativo.
2. Liderar, evaluar y desarrollar al equipo docente y de entrenadores.
3. Administrar el presupuesto del área y gestionar recursos ante rectoría.
4. Supervisar la implementación del perfil del deportista en todos los ciclos.
5. Coordinar el calendario deportivo (curricular y extracurricular).
6. Representar al área en consejo de coordinación y ante apoderados.
7. Gestionar la relación con federaciones, clubes y proveedores externos.
8. Reportar resultados con datos a rectoría cada trimestre.

**Requisitos**: título en Educación Física o Ciencias del Deporte, mínimo 5 años de experiencia docente y 2 en coordinación o jefatura. Deseable posgrado en gestión educativa o deportiva. Competencias de liderazgo, manejo de presupuesto y comunicación institucional.

**Reporta a**: Rectoría o Dirección Académica.
**Dirige a**: coordinadores, docentes EFI, entrenadores, apoyo administrativo.

**KPIs**: cumplimiento del plan anual (% de hitos logrados), resultado de evaluación docente del equipo (promedio), ejecución presupuestaria (% de desviación), satisfacción de alumnos con el área (encuesta), participación deportiva extracurricular (% de matrícula).

---

## 2. Coordinador por rama o ciclo

**Misión**: asegurar la coherencia técnica y pedagógica del programa en su rama deportiva o ciclo escolar, siendo puente entre el jefe de departamento y los docentes.

**Funciones**:
1. Supervisar la planificación y ejecución de clases en su rama o ciclo.
2. Realizar observaciones de clase y retroalimentar a los docentes a su cargo.
3. Coordinar las evaluaciones del perfil del deportista en su área.
4. Organizar los eventos deportivos internos de su rama o ciclo.
5. Gestionar la logística de implementos y espacios para su área.
6. Reportar avances y alertas al jefe de departamento semanalmente.

**Requisitos**: título en Educación Física, mínimo 3 años de experiencia docente. Dominio técnico de la rama asignada. Capacidad de liderazgo horizontal y manejo de conflictos. Clasificación Especialista en la matriz de competencias.

**Reporta a**: Jefe de Departamento.
**Dirige a**: docentes y entrenadores de su rama o ciclo.

**KPIs**: cumplimiento de planificaciones de su equipo (%), resultados de los alumnos en rúbricas del perfil (% de logro), cantidad de observaciones realizadas por semestre, satisfacción del equipo a su cargo.

---

## 3. Docente de Educación Física

**Misión**: implementar el programa de EFI en sus cursos asignados, asegurando que cada alumno progrese en el perfil del deportista según su nivel.

**Funciones**:
1. Planificar unidades y sesiones alineadas al perfil del deportista y al currículum.
2. Ejecutar clases con alto tiempo de actividad motriz y progresión diferenciada.
3. Evaluar a los alumnos con las rúbricas del área y registrar avances.
4. Participar en reuniones de área y en procesos de observación entre pares.
5. Comunicar avances y alertas a apoderados según protocolo del colegio.
6. Mantener actualizados sus registros de planificación, asistencia y evaluación.

**Requisitos**: título de Profesor de Educación Física. Dominio de al menos 2 deportes a nivel de enseñanza. Manejo de grupo y clima positivo. Disposición a trabajar con datos y rúbricas. Puede ser Especialista o En Proyección según su experiencia.

**Reporta a**: Coordinador de ciclo o Jefe de Departamento.

**KPIs**: porcentaje de logro de sus alumnos en el perfil del deportista, tiempo de actividad motriz real en sus clases (observación), cumplimiento de planificaciones entregadas, resultado en encuesta a estudiantes.

---

## 4. Entrenador de selección

**Misión**: desarrollar el nivel deportivo de los alumnos seleccionados en su rama, representando al colegio en competencias con excelencia deportiva y formativa.

**Funciones**:
1. Planificar la temporada de entrenamiento con periodización clara.
2. Dirigir entrenamientos y competencias de su selección.
3. Evaluar el progreso técnico y físico de cada deportista con registro.
4. Coordinar con el docente de EFI de los mismos alumnos para evitar sobrecargas.
5. Gestionar la logística de competencias (inscripciones, traslados, permisos).
6. Comunicar calendario y resultados a apoderados de los seleccionados.

**Requisitos**: formación deportiva específica en la rama (entrenador certificado o equivalente). Experiencia competitiva comprobable. Conocimiento de desarrollo deportivo juvenil y prevención de lesiones. No requiere título de pedagogía pero sí capacidad de enseñar y tratar con menores.

**Reporta a**: Coordinador de rama o Jefe de Departamento.

**KPIs**: asistencia a entrenamientos (% de los seleccionados), progreso técnico medido por evaluación semestral, resultados deportivos (contextualizados al nivel del grupo), retención de deportistas en la selección (% que continúa al año siguiente), cero lesiones por negligencia.

---

## 5. Preparador físico

**Misión**: diseñar y supervisar el componente de preparación física para selecciones y apoyar con evaluaciones de condición física en el programa curricular.

**Funciones**:
1. Diseñar planes de preparación física por rama y categoría.
2. Aplicar evaluaciones de condición física (test de entrada y salida).
3. Asesorar a entrenadores en cargas de entrenamiento y prevención de lesiones.
4. Gestionar el gimnasio o sala de fuerza (si existe).
5. Derivar alumnos con alertas físicas al área médica del colegio.

**Requisitos**: título en Ciencias de la Actividad Física, Kinesiología o equivalente. Experiencia en trabajo con adolescentes. Conocimiento de evaluación de condición física y periodización. Puede ser servicio externo con horas definidas.

**Reporta a**: Jefe de Departamento.

**KPIs**: cobertura de evaluaciones físicas realizadas (% de alumnos evaluados), incidencia de lesiones en selecciones, mejora de indicadores físicos entre test de entrada y salida.

---

## 6. Apoyo administrativo

**Misión**: resolver la operación logística y administrativa del área para que los docentes y entrenadores se concentren en enseñar y entrenar.

**Funciones**:
1. Gestionar reservas de espacios deportivos y coordinación de horarios.
2. Administrar el inventario de implementos deportivos.
3. Procesar inscripciones a competencias y permisos de salida.
4. Apoyar la comunicación del área (circulares, actualizaciones a apoderados).
5. Llevar el archivo de documentación del departamento (actas, evaluaciones, planificaciones).

**Requisitos**: formación técnica administrativa. Manejo de herramientas digitales (planillas, correo, plataforma del colegio). Organización y proactividad. No requiere formación deportiva.

**Reporta a**: Jefe de Departamento.

**KPIs**: cumplimiento de plazos administrativos (inscripciones, informes), estado del inventario actualizado, satisfacción del equipo docente con el soporte recibido.

---

## Adaptación según tamaño del colegio

| Tamaño | Estructura mínima | Observación |
|--------|-------------------|-------------|
| Pequeño (hasta 500 alumnos) | 1 Jefe-Docente + 1-2 docentes + entrenadores por hora | El jefe hace clases y coordina. No hay coordinador ni apoyo administrativo dedicado. |
| Mediano (500-1.200 alumnos) | 1 Jefe + 1 coordinador + 3-4 docentes + entrenadores + apoyo parcial | El coordinador puede ser un docente con horas de coordinación. |
| Grande (más de 1.200 alumnos) | 1 Jefe + 2 coordinadores + 5-8 docentes + preparador físico + entrenadores + apoyo completo | Estructura completa. El jefe no hace clases regulares. |

## Consideraciones de horas y remuneración
- El jefe de departamento necesita al menos 8-10 horas semanales no lectivas para gestión (en colegio mediano-grande).
- Los coordinadores necesitan 4-6 horas no lectivas según la cantidad de personas a cargo.
- Los entrenadores suelen tener contrato por horas de entrenamiento; considerar incluir horas de planificación.
- El apoyo administrativo puede ser media jornada en colegios medianos y jornada completa en grandes.
- Al presentar presupuesto a rectoría, incluir siempre el costo de horas no lectivas como inversión en calidad, no como gasto adicional.

## Ruta de carrera dentro del departamento
- **Docente En Proyección** avanza a **Docente Especialista** al alcanzar promedio 3.0 en la matriz y completar al menos 2 años.
- **Docente Especialista** puede postular a **Coordinador** cuando hay vacante y demuestra liderazgo.
- **Coordinador** puede postular a **Jefe de Departamento** en otro colegio o cuando hay vacante interna.
- **Entrenador** puede certificarse como docente y pasar a rol de Docente EFI si obtiene título pedagógico.
- La ruta se comunica al equipo para que cada persona sepa hacia dónde puede crecer.

## Cómo usar los perfiles en conversaciones con rectoría
- Al solicitar un cargo nuevo: presentar el perfil escrito con misión, funciones y KPIs. Mostrar la brecha en la matriz de competencias que justifica la contratación.
- Al renegociar horas: usar los KPIs para demostrar carga de trabajo real vs. horas asignadas.
- Al defender la estructura: comparar con colegios de tamaño similar. Usar datos de resultados deportivos y satisfacción para justificar inversión.
- Regla: nunca pedir un cargo sin tener claro qué va a hacer esa persona y cómo se mide su impacto.`},
"complementos":{title:"Complementos del proyecto",sectionId:"04",md:`Los complementos son los servicios de apoyo que potencian el trabajo deportivo y protegen al alumno. No son opcionales: un proyecto serio los necesita. Se implementan por etapas según recursos disponibles.

## Preparación física

### Estructura del programa
- Programa diferenciado por categoría, no una rutina genérica para todos.
- Sub-12 y menores: la preparación física está integrada en el entrenamiento deportivo (juegos de fuerza, coordinación, flexibilidad). No se usa gimnasio con cargas externas.
- Sub-14: introducción a ejercicios con peso corporal, trabajo de core, movilidad articular. Se puede usar gimnasio con supervisión directa.
- Sub-16: programa estructurado con fases (fuerza general, potencia, resistencia). Planificación coordinada con el entrenador del deporte.
- Sub-18: programa individualizado según posición, deporte y objetivos competitivos. Incluye testing físico trimestral.

### Uso del gimnasio
- Horarios protegidos para selecciones (incluido bloque de 7:00 a 8:00 AM antes de clases).
- Nunca un alumno solo en el gimnasio: siempre con supervisión de preparador físico o entrenador capacitado.
- Registro de asistencia y de cargas trabajadas por sesión.

### Conexión con el Plan Maestro
- La preparación física apoya directamente el Área 3 (planes por deporte) y alimenta la dimensión motriz del perfil del deportista (Área 2).

## Kinesiología y prevención de lesiones

### Evaluación preventiva
- Al inicio del año, screening básico para todos los seleccionados: postura, rangos de movilidad, antecedentes de lesiones previas.
- El kinesiólogo entrega un informe por alumno al entrenador con recomendaciones específicas (ej. "necesita trabajo de estabilidad de tobillo").
- Si se detecta riesgo alto, se coordina con la familia para evaluación médica externa.

### Manejo de lesiones
Protocolo paso a paso:
1. Lesión en cancha: primeros auxilios por parte del adulto a cargo, aplicar protocolo RICE si corresponde.
2. Evaluación kinesiológica dentro de 48 horas.
3. Diagnóstico y plan de recuperación con plazos estimados.
4. Comunicación a la familia, al entrenador y al coordinador deportivo.
5. Rehabilitación supervisada con progresión documentada.
6. Criterios de retorno a la actividad (return-to-play): el alumno debe cumplir todos los hitos antes de volver a entrenar con el grupo.

### Return-to-play
- El alumno no vuelve a competir hasta que el kinesiólogo (o médico, según gravedad) autorice por escrito.
- Retorno progresivo: primero ejercicios individuales, luego entrenamiento parcial con grupo, luego entrenamiento completo, finalmente competencia.
- Si el alumno recae, se reinicia el protocolo.

### Registro de lesiones
Se mantiene un registro anual con los siguientes campos:
- Nombre, deporte, categoría.
- Tipo de lesión y mecanismo (contacto, sobrecarga, accidente).
- Momento (entrenamiento o competencia).
- Tiempo de baja.
- Recurrencia (primera vez, segunda vez, crónica).

Al cierre del año se analizan los datos: qué deportes tienen más lesiones, en qué período del año se concentran, qué tipo predomina. Esto permite ajustar cargas, mejorar calentamientos o reforzar la preparación física preventiva.

### Conexión con el Plan Maestro
- La kinesiología apoya el Área 3 (planes de entrenamiento seguros) y genera datos para el Área 6 (indicadores de salud deportiva).

## Psicología deportiva

### Programa por categoría
- **Sub-12 y menores:** talleres grupales sobre juego limpio, manejo de la derrota, diversión en el deporte. Formato lúdico, integrado al entrenamiento (no sesión aparte).
- **Sub-14:** talleres sobre trabajo en equipo, comunicación, manejo de presión en competencia. Se pueden hacer sesiones específicas de 30 minutos.
- **Sub-16:** temas de identidad deportiva, motivación intrínseca, manejo de ansiedad pre-competitiva. Sesiones grupales y disponibilidad para consultas individuales.
- **Sub-18:** preparación mental para competencia de alto nivel, toma de decisiones bajo presión, proyección deportiva post-colegio. Apoyo individual para casos que lo requieran.

### Intervención en situaciones específicas
- Conflictos dentro del equipo: el psicólogo deportivo media y trabaja con el grupo.
- Alumno con ansiedad o bloqueo competitivo: atención individual, coordinación con el entrenador.
- Situaciones de bullying o exclusión dentro del contexto deportivo: intervención inmediata, coordinación con convivencia escolar.

### Conexión con el Plan Maestro
- La psicología deportiva alimenta la dimensión socioemocional del perfil del deportista (Área 2) y fortalece la cultura deportiva del colegio (Área 1).

## Programa de educación para apoderados de seleccionados

Los padres son parte del sistema y necesitan orientación:
- Charla de inicio de temporada: se explica el plan del año, las reglas, el rol esperado del apoderado.
- Temas clave: cómo apoyar sin presionar, qué decir (y qué no) después de un partido, la importancia del descanso, nutrición básica.
- Se entrega material escrito o digital con las ideas principales.
- Se abre un canal de comunicación claro (correo del coordinador, no WhatsApp del entrenador).
- Al cierre de temporada: encuesta breve de satisfacción y sugerencias.

### Conexión con el Plan Maestro
- El programa de apoderados conecta con el Área 1 (cultura deportiva) y con el Área 7 (comunicación y vínculo con familias).

## Nutrición

### Etapa 1 — Educación general
- Charlas por ciclo (una por semestre) sobre alimentación saludable para deportistas jóvenes.
- Contenidos: hidratación, qué comer antes y después de entrenar, mitos comunes, importancia del descanso.
- Se integran al programa de Educación Física o a las charlas de bienestar del colegio.

### Etapa 2 — Orientación para selecciones
- Taller específico para seleccionados y sus familias: planificación de comidas en semana de competencia, snacks para viajes, hidratación en torneos.
- Material práctico: ejemplo de menú semanal, lista de compras básica.

### Etapa 3 — Apoyo individual (solo Élite)
- Evaluación nutricional individual con profesional a cargo.
- Plan alimentario personalizado en coordinación con la familia.
- Seguimiento periódico (trimestral).
- Nunca se interviene sobre peso o composición corporal de un menor sin supervisión profesional y consentimiento de la familia.

### Conexión con el Plan Maestro
- La nutrición apoya la dimensión de salud del perfil del deportista (Área 2) y complementa la preparación física (Área 3).`},
"plan-educacion-fisica":{title:"Plan común de Educación Física",sectionId:"04",md:`El nivel Formación del modelo. Aplica al 100 % de los alumnos del colegio, independiente de su nivel deportivo. Es la base sobre la que se construye todo lo demás: si la clase de EF es buena, el proyecto deportivo tiene cimientos.

## Estructura por ciclo

El plan se organiza en cuatro ciclos que coinciden con las etapas del perfil del deportista.

### Ciclo 1 — Pre-kínder a 2.° básico (Descubrir)
- Foco en juego motor, exploración corporal y habilidades motrices básicas (correr, saltar, lanzar, trepar).
- Unidades cortas (3-4 semanas), variadas, multideporte.
- Conexión con la dimensión motriz del perfil: se evalúan patrones fundamentales al inicio y al cierre del año.

### Ciclo 2 — 3.° a 6.° básico (Explorar)
- Introducción progresiva a deportes individuales y colectivos.
- Cada unidad trabaja al menos una dimensión del perfil: motriz, socioemocional o cognitiva-táctica.
- Se incorporan juegos pre-deportivos con reglas simplificadas.
- Evaluación semestral del perfil integrada a las notas de EF.

### Ciclo 3 — 7.° básico a II medio (Desarrollar)
- Unidades más largas (5-6 semanas) con profundización técnica y táctica.
- Énfasis en trabajo en equipo, liderazgo y autocuidado (dimensión socioemocional y actitudinal).
- Se incluye una unidad anual de condición física con autoevaluación.
- Detección de talento: el docente registra alumnos con potencial para derivar a talleres o preselecciones.

### Ciclo 4 — III y IV medio (Consolidar)
- Opciones de profundización: deporte colectivo, deporte individual, acondicionamiento físico, vida activa.
- Unidad de planificación personal: el alumno diseña un plan de actividad física semanal.
- Conexión con la dimensión de autonomía del perfil: se busca que el egresado sea activo por decisión propia.

## Conexión de cada unidad con el perfil del deportista

Cada unidad del plan anual debe declarar explícitamente qué dimensión del perfil trabaja de forma prioritaria:
- **Motriz:** habilidades técnicas, capacidades físicas, coordinación.
- **Cognitiva-táctica:** comprensión de reglas, toma de decisiones en juego, lectura del espacio.
- **Socioemocional:** trabajo en equipo, manejo de frustración, juego limpio.
- **Actitudinal:** esfuerzo, perseverancia, hábito de vida activa.

El docente lo indica en su planificación y lo comunica a los alumnos al inicio de la unidad ("en esta unidad vamos a poner foco en...").

## Estándar del 60 % de actividad motriz

El tiempo de actividad motriz real debe superar el 60 % de la duración de la clase. Esto se mide así:
1. Se descuenta el tiempo de traslado, instrucciones largas, filas de espera y organización.
2. Se considera activo al alumno que está en movimiento con propósito (no parado esperando turno).
3. Mecanismo de chequeo: al menos dos veces por semestre, el coordinador observa una clase con cronómetro y registra el porcentaje real. Se conversa con el docente y se ajusta.
4. Estrategias para cumplir el estándar: estaciones simultáneas, juegos reducidos, instrucciones breves con demostración en movimiento, evitar eliminación temprana.

## Plantilla de planificación anual

Cada docente completa la siguiente estructura antes de marzo:

| Semestre | Unidad | Semanas | Deporte / contenido | Dimensión prioritaria del perfil | Evaluación |
|----------|--------|---------|----------------------|----------------------------------|------------|
| 1        | 1      | 4       | Ejemplo: atletismo   | Motriz                           | Rúbrica    |
| 1        | 2      | 5       | Ejemplo: balonmano   | Cognitiva-táctica                | Observación|
| ...      | ...    | ...     | ...                  | ...                              | ...        |

La planificación se sube a la plataforma compartida y queda visible para el coordinador y para cualquier docente que deba reemplazar.

## Coordinación entre docentes

- Reunión de equipo EF al menos una vez al mes (puede ser breve, 30 minutos).
- Agenda mínima: avance de planificaciones, casos de alumnos, ajustes de calendario.
- Un docente nuevo debe poder tomar un curso y saber exactamente qué toca esa semana gracias a la planificación en plataforma.
- Se designa un coordinador de nivel (básica / media) que revisa coherencia vertical: lo que se enseña en 4.° básico prepara lo de 5.°.

## Detección de talento y conexión con nivel Desarrollo

- El docente de EF es el primer detector. Registra en la plataforma alumnos que muestran habilidad, motivación o ambas.
- Al cierre de cada semestre, el equipo EF comparte esta lista con el coordinador deportivo.
- El coordinador invita a esos alumnos a talleres intermedios o jornadas de prueba según la rama.
- No se presiona al alumno; se ofrece la oportunidad y se conversa con la familia.

## Evaluación integrada

- La evaluación del perfil del deportista (dimensiones motriz, socioemocional, cognitiva, actitudinal) se integra al sistema de evaluación de EF.
- Se aplica una evaluación diagnóstica al inicio del año y una de cierre.
- Los resultados alimentan el registro individual del alumno y sirven de insumo para reportes al apoderado.
- Las notas de EF reflejan proceso y progreso, no solo rendimiento absoluto.

## Grupos con niveles mixtos

- En cursos donde conviven alumnos de distinto nivel motor, el docente trabaja con tareas diferenciadas dentro de la misma actividad (mismo juego, distintas reglas o exigencias).
- Se evita separar permanentemente al curso en grupos de "buenos" y "malos".
- Los alumnos que participan en selecciones no están exentos de EF; se integran con roles de liderazgo o desafíos adicionales.
- Alumnos con condiciones de salud o NEE participan con adaptaciones; se documenta el plan de adaptación.

## Equipamiento mínimo por unidad

Cada unidad de la planificación debe verificar que el material necesario esté disponible antes de comenzar. Mínimo por clase tipo:
- Balones suficientes para trabajo en parejas (1 cada 2 alumnos).
- Conos, petos y cuerdas para organización de espacios y equipos.
- Cronómetro y silbato para el docente.
- Colchonetas si la unidad incluye gimnasia o trabajo de suelo.
- El coordinador mantiene un inventario actualizado por bodega y gestiona reposición con anticipación al semestre.`},
"planes-por-deporte-y-seleccion":{title:"Planes por deporte y selecciones",sectionId:"04",md:`Niveles Desarrollo y Élite del modelo. Cada rama deportiva del colegio necesita un plan escrito, conocido y evaluable. No basta con que el entrenador "sepa lo que hace": debe estar documentado.

## Camino del alumno (pathway)

El recorrido dentro de cada deporte tiene cuatro etapas claras:

1. **Taller inicial:** abierto a todos los interesados, sin filtro. Foco en aprender el deporte, pasarlo bien y desarrollar habilidades básicas. Frecuencia: 1-2 sesiones por semana.
2. **Intermedio:** para alumnos que muestran interés sostenido y progreso. Se profundiza en técnica y táctica. Frecuencia: 2-3 sesiones por semana. Puede haber participación en competencias formativas.
3. **Preselección:** grupo ampliado del que saldrá la selección. Entrenamiento más exigente, se evalúan criterios de selección. Frecuencia: 3-4 sesiones por semana.
4. **Selección:** representa al colegio en competencias oficiales. Compromiso formal por escrito. Frecuencia: 4-5 sesiones por semana según categoría y deporte.

El paso entre etapas no es automático por edad; depende de desarrollo, compromiso y disponibilidad de cupos. El alumno y su familia deben conocer este camino desde el inicio.

## Plantilla de plan anual por deporte

Cada rama completa esta estructura antes de marzo y la sube a la plataforma:

| Período       | Fase            | Contenido técnico-táctico       | Capacidades físicas | Competencias del período | Evaluación   |
|---------------|-----------------|---------------------------------|---------------------|--------------------------|--------------|
| Mar - Abr     | Pretemporada    | Fundamentos, reactivación       | Base aeróbica, flex | Amistosos internos       | Diagnóstica  |
| May - Jul     | Competitivo 1   | Sistemas de juego, variantes    | Fuerza, velocidad   | Liga escolar fase 1      | Parcial      |
| Ago - Sep     | Transición      | Correcciones, refuerzo táctico  | Mantención          | Torneo propio            | Intermedia   |
| Oct - Nov     | Competitivo 2   | Ajuste fino, situaciones reales | Puesta a punto      | Liga escolar fase 2      | Final        |
| Dic           | Cierre          | Evaluación, retroalimentación   | Recuperación        | —                        | Autoevalua.  |

El plan debe incluir también las fechas de evaluación del perfil del deportista (entrada y salida).

## Cargas de entrenamiento por categoría

Las cargas deben respetar la etapa de desarrollo del alumno. Referencia orientadora:

| Categoría       | Edad aprox.  | Sesiones/semana | Duración sesión | Foco principal                        |
|------------------|-------------|-----------------|-----------------|---------------------------------------|
| Sub-10 / Sub-12  | 8-11 años   | 2               | 60 min          | Juego, multilateralidad, diversión    |
| Sub-14           | 12-13 años  | 2-3             | 75 min          | Técnica, introducción táctica         |
| Sub-16           | 14-15 años  | 3-4             | 90 min          | Táctica, preparación física dirigida  |
| Sub-18           | 16-17 años  | 4-5             | 90 min          | Especialización, competencia          |

Estas cargas son máximos recomendados, no mínimos obligatorios. Si un alumno participa en club externo, se coordina para evitar sobrecarga.

## Criterios de selección

Los criterios deben ser transparentes, escritos y comunicados antes del proceso de selección:

1. **Publicar los criterios** al inicio de la pretemporada: qué se va a evaluar y cómo.
2. **Categorías de evaluación:** nivel técnico, comprensión táctica, condición física, actitud y compromiso (asistencia, esfuerzo, conducta).
3. **Ponderación clara:** cada categoría tiene un peso relativo conocido por los alumnos.
4. **Registro:** las evaluaciones quedan documentadas, no son solo impresión del entrenador.
5. **Comunicación del resultado:** se conversa individualmente con cada alumno, no se publica una lista sin contexto.
6. **Derecho a preguntar:** el alumno y su familia pueden solicitar la explicación de la decisión.

## Manejo de cortes (alumnos que no quedan)

Es un momento sensible que debe manejarse con profesionalismo:
- El entrenador conversa personalmente con el alumno antes de publicar la nómina.
- Se le explica qué trabajar para mejorar y se le ofrece una alternativa (taller intermedio, otro deporte, próxima temporada).
- Nunca se comunica por lista pegada en un muro sin explicación previa.
- Si un apoderado reclama, se recibe, se muestra el registro de evaluación y se explica el proceso. No se cambia la decisión por presión, pero sí se escucha.

## Documento de compromiso del seleccionado

Todo alumno que integra una selección firma (junto a su apoderado) un documento que incluye:
- Asistencia mínima exigida a entrenamientos (ej. 80 %).
- Conducta esperada en entrenamientos, competencias y viajes.
- Rendimiento académico: no se exige promedio mínimo, pero sí que el alumno mantenga sus responsabilidades escolares. Si hay problemas, se coordina con el profesor jefe.
- Consecuencias del incumplimiento: conversación, suspensión temporal, desvinculación de la selección.
- Duración del compromiso: un año o una temporada competitiva.

## Conexión con nivel Élite

Cuando un alumno destaca a nivel de selección y proyecta rendimiento federado o de alto nivel:
- Se activa el protocolo de apoyo individual (horarios especiales, preparación física diferenciada, acompañamiento psicológico).
- Se coordina con la familia y, si aplica, con el club o federación donde el alumno entrena externamente.
- Se designa un tutor académico que monitorea el impacto de la carga deportiva en el rendimiento escolar.
- Se revisa caso a caso en reunión de coordinación deportiva al menos una vez al semestre.

## Registro y documentación

Todo debe quedar registrado en la plataforma del departamento:
- Asistencia a entrenamientos por sesión.
- Evaluaciones técnicas y físicas semestrales.
- Nóminas de competencia con resultados.
- Incidentes disciplinarios o lesiones.
- Plan anual con sus ajustes durante el año (el plan vive, no es estático).

El registro no es burocracia: es la base para evaluar si el trabajo está dando resultados y para darle continuidad al programa si cambia el entrenador.`},
"calendario-y-criterios":{title:"Competencias: calendario y criterios",sectionId:"05",md:`Las competencias son la expresión visible del proyecto deportivo. Un buen calendario no se arma por inercia ("siempre hemos ido a este torneo"), sino con criterio estratégico: por qué competimos, dónde y para qué.

## Sistema de clasificación de competencias

Toda competencia en el calendario se clasifica en una de tres categorías:

### Formativa
- Objetivo: que los alumnos vivan la experiencia de competir en un ambiente seguro.
- Participan alumnos de talleres y niveles intermedios, con rotación amplia (todos juegan).
- No se prioriza el resultado. Se evalúa actitud, esfuerzo y aplicación de lo entrenado.
- Ejemplos: torneos internos, encuentros amistosos con colegios cercanos, festivales deportivos.

### Competitiva
- Objetivo: medir el nivel del programa contra otros colegios en instancias oficiales.
- Participan selecciones con nómina definida por criterios de selección.
- Se busca el mejor resultado posible dentro del juego limpio.
- Ejemplos: ligas escolares, campeonatos zonales y regionales, torneos interescolares.

### De posicionamiento
- Objetivo: posicionar al colegio en el circuito deportivo escolar y generar visibilidad del programa.
- Competencias de nivel nacional, invitacionales de prestigio o torneos federados.
- Participación selectiva: se evalúa costo-beneficio antes de inscribirse.
- Ejemplos: campeonatos nacionales escolares, torneos internacionales invitacionales.

## Criterios para elegir en qué competencias participar

Antes de inscribir al colegio en una competencia, se responden estas preguntas:
1. **Alineación con el plan:** esta competencia aporta al desarrollo de los alumnos o solo consume recursos?
2. **Nivel adecuado:** el nivel de la competencia es apropiado para nuestros alumnos? (ni tan bajo que no desafíe, ni tan alto que frustre).
3. **Calendario:** la fecha es compatible con el calendario académico y con la planificación deportiva?
4. **Costo:** el costo (inscripción, transporte, alojamiento, tiempo) se justifica respecto al beneficio?
5. **Historial:** si participamos antes, la experiencia fue positiva? La organización fue seria?
6. **Impacto formativo:** los alumnos van a aprender algo de esta experiencia?

Si una competencia no pasa al menos cuatro de estos filtros, se descarta o se posterga.

## Plantilla de calendario anual

El calendario se arma en enero-febrero y se publica en marzo. Formato:

| Mes | Competencia | Deporte | Categoría | Clasificación (F/C/P) | Sede | Costo estimado | Responsable | Estado |
|-----|-------------|---------|-----------|------------------------|------|----------------|-------------|--------|
| Abr | Torneo interno | Multidef. | Todas | Formativa | Colegio | $0 | Coord. EF | Confirmado |
| May | Liga escolar F1 | Fútbol | Sub-14 | Competitiva | Ext. | $XX | Entrenador | Confirmado |
| ... | ... | ... | ... | ... | ... | ... | ... | ... |

Columnas clave:
- **Clasificación (F/C/P):** indica si es formativa, competitiva o de posicionamiento.
- **Costo estimado:** permite planificar el presupuesto anual de competencias.
- **Estado:** tentativo, confirmado o cancelado. Se actualiza durante el año.

## Evaluación año a año: mantener, soltar o agregar

Al cierre de cada temporada, se revisa cada competencia del calendario:

### Mantener si:
- La experiencia fue positiva para los alumnos (aprendizaje, nivel adecuado).
- La organización fue seria y profesional.
- El costo-beneficio fue razonable.

### Soltar si:
- La organización fue deficiente (horarios incumplidos, arbitraje malo, seguridad insuficiente).
- El nivel no fue adecuado (demasiado bajo o brutalmente superior).
- El costo superó el beneficio formativo o competitivo.
- Generó conflictos recurrentes con familias o con otros colegios.

### Agregar si:
- Se identifica una competencia nueva que llena un vacío en el calendario (ej. falta una instancia formativa para Sub-12).
- Se recibe una invitación interesante que pasa los criterios de selección.
- El programa creció y necesita nuevos desafíos.

Esta evaluación se registra en un documento simple (una tabla con competencia, evaluación, decisión) y queda como insumo para el año siguiente.

## Organizar un torneo propio

Organizar un torneo con sello del colegio es una herramienta de posicionamiento y de formación. Antes de lanzarlo, revisar esta lista:

### Checklist de factibilidad
- Hay infraestructura suficiente (canchas, camarines, estacionamiento)?
- Hay personal disponible para organizar (al menos 3-4 meses de preparación)?
- Hay presupuesto o se puede financiar con inscripciones y auspicios?
- El calendario tiene espacio (no hay conflicto con otras competencias importantes)?
- Hay apoyo de la dirección del colegio?

### Línea de tiempo sugerida
- **4 meses antes:** definir formato, categorías, fechas, presupuesto preliminar.
- **3 meses antes:** invitar colegios, abrir inscripciones, confirmar arbitraje.
- **2 meses antes:** cerrar inscripciones, confirmar logística (alimentación, premiación, salud).
- **1 mes antes:** programación de partidos, comunicación a familias, asignación de roles al staff.
- **1 semana antes:** ensayo logístico, revisión de infraestructura, confirmación final de equipos.

### Consideraciones de presupuesto
- Ingresos: inscripciones, venta de alimentos, auspicios.
- Gastos: arbitraje, premiación, insumos médicos, alimentación staff, difusión.
- El torneo no necesita ser rentable, pero tampoco debe generar déficit sin aprobación previa.

## Calendario de eventos comunitarios

Además de competencias formales, el departamento organiza o participa en eventos para la comunidad:
- Corrida familiar o caminata del colegio (una vez al año).
- Liga interna de apoderados (fútbol, vóleibol u otro).
- Jornada deportiva para funcionarios del colegio.
- Día del deporte escolar con actividades para todos los niveles.

Estos eventos fortalecen la cultura deportiva del colegio (Área 1 del Plan Maestro) y generan sentido de pertenencia.

## Comunicación del calendario a las familias

- El calendario tentativo se envía a las familias en marzo, dejando claro que las fechas pueden ajustarse.
- Cada competencia se confirma con al menos dos semanas de anticipación, indicando: fecha, lugar, horario de salida, horario estimado de regreso, qué llevar.
- Si una competencia se cancela o cambia de fecha, se avisa de inmediato con explicación breve.
- Al cierre del año se comparte un resumen: en cuántas competencias participamos, principales resultados, aprendizajes.`},
"protocolos-viajes-y-reclamos":{title:"Protocolos viajes y reclamos",sectionId:"05",md:`Todo lo que ocurre fuera del colegio tiene mayor riesgo y mayor visibilidad. Estos protocolos existen para que cada salida sea segura, ordenada y represente bien al colegio.

## Protocolo de viaje completo

### Antes del viaje
1. Confirmar nómina de alumnos y verificar que todos tengan autorización firmada vigente.
2. Confirmar transporte: empresa, patente del vehículo, datos del conductor, seguro al día.
3. Preparar carpeta de viaje (física o digital) con: nómina, autorizaciones, datos de emergencia de cada alumno, contacto del colegio, contacto del lugar de destino, póliza de seguro escolar.
4. Comunicar a las familias: fecha, hora de salida y regreso estimado, lugar, qué llevar, contacto del adulto responsable.
5. Verificar botiquín de primeros auxilios completo.
6. Designar adulto responsable del grupo (puede ser el entrenador, pero debe estar formalizado).
7. Si el viaje incluye pernoctar: confirmar alojamiento, alimentación, distribución de habitaciones, horarios de descanso.

### Durante el viaje
- El adulto responsable lleva la carpeta de viaje y tiene acceso inmediato a los datos de emergencia.
- Conteo de alumnos al subir y bajar del transporte, al llegar al recinto y al retirarse.
- Hidratación y alimentación asegurada (llevar agua y snacks aunque el evento ofrezca).
- Teléfono del adulto responsable siempre encendido y con batería.
- Si ocurre un accidente o emergencia: primeros auxilios, llamar a emergencias si corresponde, avisar al colegio y a la familia del alumno afectado. Registrar todo por escrito.

### Después del viaje
- Confirmar que todos los alumnos fueron entregados o llegaron a destino.
- Informe breve al coordinador: resultado deportivo, incidentes (si los hubo), observaciones.
- Devolver material y equipamiento al colegio.
- Si hubo incidentes, completar el registro formal dentro de las 24 horas siguientes.

## Documento de autorización

Cada alumno que sale del colegio a una actividad deportiva debe tener una autorización firmada por el apoderado. El documento incluye:
- Nombre completo del alumno, curso, RUT.
- Actividad, fecha, lugar de destino.
- Hora de salida y hora estimada de regreso.
- Medio de transporte.
- Datos de emergencia: contacto del apoderado (dos números), previsión de salud, alergias, medicamentos, condiciones médicas relevantes.
- Autorización explícita para que el adulto responsable tome decisiones médicas de urgencia si no se logra contactar al apoderado.
- Firma del apoderado y fecha.

Se puede usar una autorización anual para competencias recurrentes (ej. liga escolar), pero se debe confirmar antes de cada salida que los datos siguen vigentes.

## Ratio adultos-alumnos por edad

| Categoría        | Edad aprox.  | Ratio mínimo        | Observación                                      |
|------------------|-------------|----------------------|--------------------------------------------------|
| Sub-10 / Sub-12  | 8-11 años   | 1 adulto cada 8     | Al menos uno debe ser funcionario del colegio     |
| Sub-14           | 12-13 años  | 1 adulto cada 10    | Al menos uno debe ser funcionario del colegio     |
| Sub-16           | 14-15 años  | 1 adulto cada 12    | Entrenador más un acompañante                     |
| Sub-18           | 16-17 años  | 1 adulto cada 15    | Entrenador más un acompañante                     |

Si el viaje incluye pernoctar, se suma un adulto adicional al ratio. Los apoderados acompañantes deben estar autorizados por el colegio y conocer el protocolo.

## Código de conducta

### Para alumnos deportistas
- Representar al colegio con respeto: hacia rivales, árbitros, organizadores y público.
- Cero tolerancia a agresiones físicas o verbales, dentro y fuera de la cancha.
- Cumplir horarios, usar correctamente la indumentaria del colegio, cuidar el material.
- No usar celular durante entrenamientos o competencias salvo autorización del entrenador.
- En viajes con pernocte: respetar horarios de descanso, no salir del alojamiento sin autorización.

### Para entrenadores y docentes
- Modelar la conducta esperada: no gritar al árbitro, no humillar al rival, no presionar con lenguaje agresivo.
- Priorizar la formación del alumno por sobre el resultado.
- Tomar decisiones deportivas con criterio técnico, no emocional.
- No consumir alcohol ni fumar frente a los alumnos en ninguna circunstancia.

### Para apoderados espectadores
- Apoyar, no dirigir: las instrucciones tácticas las da el entrenador, no la tribuna.
- No increpar al árbitro, al entrenador ni a alumnos (propios o rivales).
- No ingresar a la cancha, camarín ni zona técnica sin autorización.
- Si un apoderado incumple reiteradamente, se le puede restringir la asistencia a competencias.

### Consecuencias del incumplimiento
1. **Primera falta leve:** conversación privada con el involucrado y registro escrito.
2. **Falta grave o reiterada:** suspensión de la próxima competencia (alumno) o restricción de asistencia (apoderado). Informe a la dirección del colegio.
3. **Falta gravísima** (agresión física, consumo de sustancias, conducta que pone en riesgo a otros): desvinculación inmediata de la actividad, informe a dirección, aplicación del reglamento interno del colegio.

## Manejo de incidentes en competencia

Si ocurre un incidente durante una competencia (agresión, lesión grave, conflicto con otro colegio, situación de riesgo):

1. **Contener:** asegurar la integridad física de los alumnos. Retirar del lugar si es necesario.
2. **Registrar:** anotar los hechos de inmediato (qué pasó, quiénes estuvieron involucrados, hora, lugar, testigos). Tomar fotos si aplica.
3. **Informar:** llamar al coordinador deportivo del colegio y al apoderado del alumno afectado.
4. **Gestionar con la organización:** presentar el reclamo al árbitro, delegado o comité organizador según el canal formal del torneo.
5. **No escalar en el momento:** evitar discusiones públicas. Todo se gestiona por canal formal, en frío.
6. **Informe escrito:** dentro de las 24 horas, el adulto responsable entrega un informe al coordinador con los hechos, las acciones tomadas y las recomendaciones.

## Proceso de reclamos con organizaciones externas

- Los reclamos se presentan por escrito, usando el formulario o canal oficial de la liga, asociación o federación.
- Solo el coordinador deportivo o el director del departamento firma reclamos formales, no el entrenador individualmente.
- Se adjunta evidencia: informe del incidente, fotos, testimonios.
- Se hace seguimiento hasta obtener respuesta. Si no hay respuesta en plazo razonable, se escala.
- Se informa a la familia del alumno afectado sobre el estado del reclamo.
- Todo reclamo queda archivado como precedente para futuras decisiones (ej. no volver a participar en esa competencia).

## Revisión post-competencia

Después de cada competencia relevante (no amistosos menores), el entrenador completa una revisión breve:
- Resultado deportivo y análisis (qué funcionó, qué no).
- Conducta del equipo, del cuerpo técnico y de los apoderados.
- Incidentes, si los hubo.
- Logística: qué salió bien y qué hay que mejorar para la próxima.
- Una cosa concreta a trabajar en los próximos entrenamientos.

Esta revisión se comparte en la reunión de coordinación deportiva mensual.

## Redes sociales y medios de comunicación

- Las publicaciones oficiales sobre competencias las gestiona el canal de comunicaciones del colegio o la persona designada por el departamento deportivo.
- Los entrenadores pueden compartir resultados en redes institucionales con tono positivo y formativo. No se publican críticas a rivales, árbitros ni organizadores.
- Fotos y videos de alumnos: solo se publican si existe autorización de imagen vigente firmada por el apoderado.
- No se publican resultados abultados con tono de burla ni se expone a alumnos que tuvieron un mal desempeño.
- Si un medio de comunicación externo solicita entrevista o cobertura, se coordina con la dirección de comunicaciones del colegio antes de responder.`},
"plan-inversion-3-anos":{title:"Plan de inversión a 3 años",sectionId:"06",md:`Proyección para presentar a rectoría una vez cerrado el diagnóstico.
Cada inversión se justifica con impacto deportivo, retención de familias o posicionamiento institucional.

## Criterios de priorización

Toda inversión propuesta se evalúa con cuatro criterios antes de incluirla en el plan:

1. **Impacto**: ¿a cuántos alumnos o familias beneficia directamente?
2. **Costo**: ¿es financiable con el presupuesto del área o requiere aprobación especial?
3. **Urgencia**: ¿hay riesgo de seguridad, normativo o de calidad si no se hace?
4. **Visibilidad**: ¿genera percepción positiva en la comunidad y diferenciación del colegio?

Se priorizan primero las inversiones con alta urgencia y alto impacto. Las de alta visibilidad y bajo costo son victorias rápidas útiles para generar confianza.

## Año 1: ordenar y operar

| Inversión | Costo estimado | Área del modelo | Retorno esperado |
|-----------|---------------|-----------------|------------------|
| Reposición de materiales críticos (balones, redes, colchonetas) | $1.500.000 - $3.000.000 | Formación | Clases funcionan sin improvisación; percepción docente mejora |
| Mejoras de seguridad: iluminación, señalética, protecciones | $2.000.000 - $4.000.000 | Infraestructura | Reducción de riesgo de accidentes; cumplimiento normativo |
| Puesta en marcha de plataforma de gestión (SCM) | $500.000 - $1.000.000 | Transversal | Datos centralizados; reportes automáticos a rectoría |
| Botiquines completos y puntos de hidratación | $300.000 - $600.000 | Infraestructura | Cumplimiento de protocolos de seguridad |
| Vestuario básico de selecciones (camisetas, shorts) | $1.000.000 - $2.000.000 | Desarrollo | Identidad visual; orgullo de pertenencia |

**Riesgo principal año 1**: intentar hacer todo a la vez. Mejor ejecutar pocas inversiones bien que muchas a medias.

## Año 2: crecer

| Inversión | Costo estimado | Área del modelo | Retorno esperado |
|-----------|---------------|-----------------|------------------|
| Equipamiento mayor por disciplina (arcos reglamentarios, máquina de pádel, etc.) | $3.000.000 - $6.000.000 | Desarrollo | Calidad de entrenamiento competitivo sube un nivel |
| Sistema de video para análisis de selecciones (AutoCut) | $1.500.000 - $3.000.000 | Élite | Diferenciación clara; herramienta de retroalimentación para deportistas |
| Consolidación de programas de adultos (equipamiento dedicado) | $500.000 - $1.500.000 | Comunidad | Autofinanciamiento parcial del área |
| Evento deportivo propio instalado (torneo aniversario) | $1.000.000 - $2.000.000 | Comunidad | Posicionamiento zonal; cobertura en RRSS y prensa local |
| Mejoras de superficie: reparación de pisos, pintura de canchas | $2.000.000 - $5.000.000 | Infraestructura | Durabilidad de recintos; imagen institucional |

**Riesgo principal año 2**: que los programas de adultos no generen los ingresos proyectados. Tener plan B de financiamiento.

## Año 3: diferenciarse

| Inversión | Costo estimado | Área del modelo | Retorno esperado |
|-----------|---------------|-----------------|------------------|
| Inversión estrella (definir con el colegio: techado de cancha, piscina temperada, gimnasio equipado) | $15.000.000 - $50.000.000+ | Infraestructura | Salto cualitativo; argumento de matrícula |
| Tecnología avanzada de análisis para selecciones (sensores, GPS deportivo) | $3.000.000 - $5.000.000 | Élite | Datos de rendimiento de nivel federado |
| Nueva disciplina o programa según demanda detectada | $2.000.000 - $4.000.000 | Desarrollo | Ampliación de oferta; captación de alumnos nuevos |
| Certificación o alianza con entidad deportiva de prestigio | Variable | Posicionamiento | El colegio como referencia deportiva de la zona |

**Riesgo principal año 3**: la inversión estrella requiere aprobación de directorio o sostenedor. Preparar el caso desde año 2.

## Cómo construir el caso para rectoría

1. Partir del problema, no de la solución: "Los alumnos entrenan con balones rotos" pesa más que "Necesitamos balones nuevos".
2. Vincular cada inversión a un objetivo del Plan Maestro con indicador medible.
3. Cuantificar el retorno donde sea posible: familias retenidas, matrícula nueva, ingresos por programas.
4. Presentar alternativas con distintos niveles de inversión (mínimo, recomendado, ideal).
5. Incluir cronograma de ejecución y responsable.

## Marco de retorno de inversión (ROI)

No toda inversión se mide en dinero. El ROI del área deportiva se evalúa en cuatro dimensiones:

- **Retención**: familias que permanecen en el colegio influidas por la oferta deportiva.
- **Matrícula**: familias nuevas que eligen el colegio por su propuesta deportiva.
- **Posicionamiento**: reputación del colegio en la zona como referente deportivo.
- **Resultados deportivos**: logros competitivos que refuerzan la marca institucional.

Para cada inversión propuesta, indicar cuál de estas dimensiones impacta y con qué evidencia se medirá.

## Estrategia de fases

- Ninguna inversión grande se presenta sola: siempre va acompañada de resultados del año anterior que justifiquen escalar.
- Las inversiones de año 1 generan la credibilidad para pedir las de año 2.
- Si una inversión de un año no se concreta, se reclasifica al siguiente sin perder el caso construido.

## Formato para presentar cada inversión

Para cada propuesta individual, usar esta estructura:

1. **Nombre de la inversión**: una frase clara.
2. **Problema que resuelve**: situación actual y consecuencia de no invertir.
3. **Nivel del modelo al que sirve**: Formación / Desarrollo / Élite / Comunidad / Infraestructura.
4. **Costo estimado**: rango con cotización de referencia si está disponible.
5. **Retorno esperado**: en qué dimensión de ROI impacta y cómo se medirá.
6. **Plazo de ejecución**: desde aprobación hasta operación.
7. **Riesgos**: qué puede salir mal y cómo se mitiga.
8. **Alternativas**: qué pasa si no se aprueba o si se aprueba parcialmente.`},
"presupuesto-anual-plantilla":{title:"Presupuesto anual - plantilla",sectionId:"06",md:`## Estructura de ingresos

### Aporte institucional
- Asignación directa del colegio al departamento de deportes (negociada con rectoría en noviembre del año anterior).
- En año 1 es realista pedir lo mismo que el año previo más un delta acotado para materializar el Plan Maestro. En año 3 se puede argumentar retorno demostrado.

### Ingresos propios
- Academias y talleres extraprogramáticos pagados (cuota mensual por alumno).
- Programas de adultos: clases, running team, ligas internas (ver carpeta 07-comunidad).
- Arriendo puntual de instalaciones cuando no hay uso escolar.
- Auspicios o alianzas con marcas deportivas (camisetas, equipamiento a cambio de visibilidad).

### Consideración año 1 vs año 3
- Año 1: los ingresos propios serán bajos; la mayor parte del presupuesto viene del aporte institucional. No sobredimensionar proyecciones.
- Año 3: los programas de adultos y academias ya consolidados deben cubrir al menos el 15-20 % del gasto operativo del área.

## Categorías de gasto y sub-ítems

### 1. Personal
- Horas docentes curriculares (EF) y extraprogramáticas (selecciones, academias).
- Entrenadores externos por disciplina (contrato por hora o mensual).
- Servicios profesionales: preparador físico, kinesiólogo, nutricionista puntual.
- Horas extra por programas de comunidad (adultos, eventos).

### 2. Competencias
- Inscripciones a ligas y torneos (ADECOP, federaciones, amistosos).
- Arbitraje en partidos de local.
- Transporte: buses para partidos fuera de sede.
- Alimentación y colaciones en jornadas largas o viajes.
- Alojamiento cuando corresponda (regionales, nacionales).

### 3. Materiales deportivos
- Reposición programada: balones, redes, conos, aros, colchonetas.
- Incorporación por deporte nuevo o crecimiento de matrícula.
- Vestuario institucional: camisetas, shorts, buzos de selección.

### 4. Infraestructura y mantención
- Mantención preventiva de canchas, gimnasio, piscina (si aplica).
- Reparaciones menores (pisos, arcos, mallas, iluminación).
- Mejoras de seguridad: señalética, protecciones, botiquines.

### 5. Tecnología
- Licencias o hosting de plataformas (SCM, CoachDrill, AutoCut).
- Equipamiento de video y análisis.
- Dispositivos para evaluaciones de perfil atlético.

### 6. Formación del equipo
- Capacitaciones internas y externas (cursos, congresos, certificaciones).
- Primeros auxilios y RCP para todo el staff.

### 7. Eventos propios
- Torneo aniversario, jornada de puertas abiertas, gala deportiva.
- Producción: premios, amplificación, logística.

### 8. Imprevistos y contingencia
- Reservar entre 5 % y 10 % del presupuesto total.
- Solo se usa con autorización del coordinador y se reporta a rectoría.

## Tabla de seguimiento mensual

Cada línea de gasto se registra con las siguientes columnas:

| Concepto | Área Plan Maestro | Presupuestado | Ejecutado | Desvío (%) | Notas |
|----------|-------------------|---------------|-----------|------------|-------|
| Ejemplo: buses competencias | Desarrollo-Selecciones | $500.000 | $480.000 | -4 % | Un viaje menos en marzo |

- La columna "Área Plan Maestro" vincula cada gasto a un nivel del modelo (Formación, Desarrollo, Élite, Comunidad, Infraestructura).
- El desvío se calcula automáticamente. Si supera +10 %, se activa alerta.

## Metodología de seguimiento

- Corte mensual: el coordinador consolida cifras los primeros 5 días hábiles del mes siguiente.
- Revisión trimestral con rectoría: presentación de ejecutado, tendencias y proyección de cierre.
- Alerta temprana: cualquier gasto no presupuestado o desvío mayor a 10 % se comunica a rectoría antes de ejecutar, no después.

## Proceso de aprobación

1. El coordinador arma el borrador de presupuesto (noviembre).
2. Revisión interna con el equipo docente del área.
3. Presentación a rectoría con justificación por línea y vínculo al Plan Maestro.
4. Rectoría aprueba, ajusta o devuelve. Se formaliza antes del inicio del año escolar.
5. Gastos dentro del presupuesto aprobado: ejecución directa por el coordinador.
6. Gastos fuera de presupuesto: aprobación escrita de rectoría antes de comprometer.

## Gestión de contingencias

- El fondo de imprevistos cubre situaciones no previstas (rotura de equipamiento, emergencia de transporte).
- Si el fondo se agota antes del segundo semestre, se negocia con rectoría reasignación desde otra línea.
- Nunca se usa el fondo de imprevistos para cubrir mala planificación recurrente: si un gasto se repite, pasa a ser línea presupuestaria el año siguiente.

## Cierre de año

- En diciembre se consolida el presupuesto ejecutado final.
- Se elabora un informe breve: qué se gastó, qué se ahorró, qué faltó.
- Las lecciones del cierre alimentan el presupuesto del año siguiente.
- El informe se entrega a rectoría junto con la propuesta del nuevo período.`},
"tecnologia-suite":{title:"Tecnología del departamento",sectionId:"06",md:`Ventaja diferencial: plataformas propias ya construidas y en uso.
El colegio que llega con tecnología dedicada al área deportiva se diferencia de inmediato.

## Plataforma 1: SCM - Gestión del área

### Qué hace
Sistema centralizado para administrar toda la operación del departamento de deportes:
- Registro de alumnos por curso, nivel y disciplina.
- Gestión de selecciones: nóminas, convocatorias, historial de participación.
- Asistencia a clases curriculares y extraprogramáticas.
- Comunicaciones directas con apoderados (avisos, citaciones, resultados).
- Evaluaciones del perfil atlético con seguimiento longitudinal curso a curso.
- Reportes automáticos para rectoría: participación, cobertura, tendencias.

### Qué problema resuelve
Sin SCM, la información vive en planillas sueltas, cuadernos y memorias individuales. Cuando un profesor se va, se va con los datos. SCM centraliza todo en un lugar accesible para el equipo, con historial que no se pierde.

## Plataforma 2: CoachDrill - Planificación de entrenamientos

### Qué hace
Herramienta para que cada docente y entrenador planifique sus sesiones de manera estandarizada:
- Biblioteca de ejercicios por deporte, objetivo y grupo etario.
- Plantillas de sesión con estructura definida (calentamiento, parte principal, vuelta a la calma).
- Visualización del plan semanal y mensual del equipo completo.
- El coordinador puede revisar la planificación de todo el equipo desde un solo lugar.

### Qué problema resuelve
Cada profesor planifica como quiere o no planifica. No hay visibilidad de qué se enseña, no hay progresión documentada y no se puede evaluar la calidad de las sesiones. CoachDrill hace visible lo invisible.

## Plataforma 3: AutoCut - Análisis de video

### Qué hace
Sistema de registro y análisis de video enfocado en selecciones:
- Grabación de partidos y entrenamientos clave.
- Corte automático o asistido de jugadas relevantes.
- Etiquetado por situación de juego (ataque, defensa, transición, pelota parada).
- Clips compartibles con deportistas para retroalimentación individual.
- Archivo histórico de partidos por temporada.

### Qué problema resuelve
El análisis de video es estándar en el deporte de rendimiento, pero casi ningún colegio lo hace. AutoCut permite dar retroalimentación objetiva, preparar rivales y documentar el progreso de cada selección a lo largo de la temporada.

## Comparación con alternativas comerciales

| Criterio | Plataformas propias | Soluciones comerciales (Hudl, Teamsnap, etc.) |
|----------|--------------------|-------------------------------------------------|
| Costo anual | Marginal (hosting + mantenimiento) | USD 500-5.000 por plataforma |
| Personalización | Total, adaptada al modelo del colegio | Limitada a lo que ofrece el proveedor |
| Integración entre módulos | Nativa (SCM + CoachDrill + AutoCut comparten datos) | Requiere integraciones manuales o no existe |
| Datos | Propiedad del colegio, alojados donde se decida | En servidores del proveedor, con sus términos |
| Soporte | Depende del desarrollador (riesgo si es una sola persona) | Soporte del proveedor, pero genérico |

**Por qué lo propio es mejor en este caso**: el modelo del departamento tiene lógica específica (niveles Formación-Desarrollo-Élite, perfil atlético longitudinal, vínculo clase-selección) que ninguna plataforma comercial resuelve sin personalización costosa.

**Riesgo de lo propio**: dependencia del desarrollador. Mitigación: documentar el código, usar tecnologías estándar, tener plan de contingencia si el desarrollador no está disponible.

## Arquitectura de datos

- SCM es el sistema maestro: contiene el registro de alumnos, cursos y selecciones.
- CoachDrill consulta las nóminas de SCM para asociar planificaciones a grupos reales.
- AutoCut etiqueta videos con datos de SCM (nombre del deportista, selección, temporada).
- Los tres sistemas alimentan un panel de indicadores para el coordinador y para rectoría.
- Exportación de datos en formatos estándar (CSV, PDF) para respaldo y reportes ad hoc.

## Hosting y seguridad

- Hosting en servidor dedicado o cloud (definir con el colegio según política de TI).
- Certificado SSL para todas las plataformas (acceso solo por HTTPS).
- Respaldos automáticos diarios con retención de al menos 30 días.
- Acceso por usuario y contraseña; roles diferenciados (coordinador, docente, apoderado en modo consulta).
- Cumplimiento de Ley 21.719: ver carpeta 09-administracion-normativa para detalle de protección de datos.

## Integración con sistemas del colegio

- Evaluar si el sistema de notas o matrícula del colegio tiene API o exportación que permita sincronizar listas de alumnos con SCM (evitar doble digitación).
- Si el colegio usa plataforma de comunicación (Schoolnet, Educamos, etc.), definir si las comunicaciones deportivas salen por ahí o por SCM.
- En cualquier caso, SCM es la fuente de verdad para datos deportivos; el sistema del colegio lo es para datos académicos.

## Estructura de costos

| Ítem | Costo estimado anual |
|------|---------------------|
| Hosting (cloud básico) | $200.000 - $500.000 |
| Dominio y certificado SSL | $30.000 - $50.000 |
| Mantenimiento y actualizaciones (horas de desarrollo) | $500.000 - $1.500.000 |
| Equipamiento de video (cámara, trípode, almacenamiento) | $500.000 - $1.000.000 (inversión inicial) |
| **Total operativo anual (sin inversión inicial)** | **$730.000 - $2.050.000** |

Comparar con el costo de una sola plataforma comercial equivalente para dimensionar el ahorro.

## Plan de implementación

### Fase 1 - Piloto (meses 1-3)
- Cargar una selección y un nivel de EF en SCM. Un entrenador usa CoachDrill un mes completo. Dos partidos con AutoCut. Feedback y ajuste.

### Fase 2 - Expansión (meses 4-6)
- Todas las selecciones y niveles curriculares en SCM. Todo el equipo en CoachDrill. AutoCut en partidos de local.

### Fase 3 - Consolidación (meses 7-12)
- Primer reporte anual desde las plataformas. Perfil atlético con datos longitudinales. Ajustes basados en uso real.

## Plan de capacitación

- Sesión inicial de 2 horas por plataforma para todo el equipo (presencial, con práctica).
- Manual breve por plataforma (máximo 5 páginas con capturas de pantalla).
- Revisión de uso real a los 3 meses: quién lo usa, quién no, y qué ajustar.`},
"programas-apoderados-staff":{title:"Programas para apoderados y staff",sectionId:"07",md:`La capa transversal del modelo. Objetivo: pertenencia, identidad y retención.
Un colegio donde los padres también hacen deporte es un colegio del que cuesta irse.

## Programa 1: Running Team del colegio

- Entrenamiento semanal (1-2 sesiones) en horario que no interfiera con uso escolar (mañana temprano o tarde-noche).
- Niveles: principiante (caminar-trotar), intermedio (5-10 km), avanzado (media maratón y más).
- Participación en corridas con camiseta institucional: el colegio se ve en la calle.
- Costo: cuota mensual que cubra el instructor y la polera de running.
- Entregable por temporada: al menos una corrida grupal con foto institucional.

## Programa 2: Ligas internas de apoderados

- Deportes según infraestructura disponible: fútbol, tenis, pádel, vóleibol, básquetbol.
- Formato de liga corta: 8-10 fechas por semestre, partidos los sábados por la mañana.
- Organización: inscripción por equipo, fixture automático, tabla de posiciones visible.
- Premiación simbólica al final de cada temporada (trofeo, cena, reconocimiento en acto).
- Arbitraje: alumnos de enseñanza media como árbitros (formación adicional para ellos).

## Programa 3: Clases para adultos en horarios valle

- Disciplinas: funcional, yoga, pilates, spinning, defensa personal (según espacio y demanda).
- Horarios: franjas donde las instalaciones están vacías (mañanas después de entrada de alumnos, tardes-noche después de selecciones, sábados).
- Formato: clases de 45-60 minutos, con cupo máximo según espacio.
- Instructor: docentes del área con horas extra pagadas, o instructor externo financiado por la cuota.
- Mínimo viable para abrir una clase: 8 inscritos.

## Programa 4: Escuela deportiva familiar

- Sábados: padres e hijos hacen deporte juntos. Formato rotativo (un deporte distinto cada sesión).
- Duración: 90 minutos. Incluye actividad conjunta y cierre social.
- Abierto a toda la familia. Sin costo o con aporte voluntario para materiales.

## Programa 5: Torneo aniversario

- Evento anual multideporte que convoca a alumnos, apoderados, staff y exalumnos.
- Categorías mixtas: equipos con combinación de roles (apoderado + alumno + docente).
- Cierre con premiación y convivencia. Cobertura en RRSS y boletín institucional.

## Modelo de operación

### Horarios
- Lunes a viernes: clases de adultos en franjas 7:00-8:00, 18:30-20:00 o según disponibilidad real.
- Sábados: ligas internas por la mañana (9:00-13:00), escuela familiar (10:00-11:30).
- Ningún programa de comunidad compite con el uso escolar ni con selecciones.

### Precios y financiamiento
- Modelo autofinanciado: la cuota de cada programa cubre costos directos (instructor, materiales, seguros).
- Precio accesible: no es negocio, es retención. Si el programa se autopaga, cumple su objetivo financiero.
- Staff del colegio: acceso gratuito o con descuento como beneficio laboral.

### Asignación de instructores
- Prioridad: docentes del área con horas extra remuneradas (conocen el contexto y las familias).
- Alternativa: instructor externo contratado específicamente, financiado por la cuota del programa.
- Regla: nadie trabaja gratis. Las horas de comunidad se pagan o se compensan formalmente.

## Secuencia de lanzamiento

1. **Primer semestre año 1**: Running Team (bajo costo, alta visibilidad, fácil de operar).
2. **Segundo semestre año 1**: una clase de adultos (funcional o yoga, la de mayor demanda en encuesta).
3. **Primer semestre año 2**: liga interna en un deporte, escuela familiar mensual.
4. **Segundo semestre año 2**: torneo aniversario como evento consolidado.
5. **Año 3**: ampliar según demanda real. No abrir programas que no se puedan sostener.

## Marketing hacia las familias

- Comunicación directa por los canales del colegio (correo, app, reunión de apoderados).
- Clase abierta gratuita como enganche para cada programa nuevo.
- Testimonios de participantes en boletín institucional.
- Fotos y resultados en RRSS del colegio (con consentimiento).
- El mejor marketing es el boca a boca: un programa bueno se llena solo.

## Indicadores de éxito

### Participación
- Adultos activos por mes (meta año 1: al menos 30 participantes regulares).
- Familias con más de un miembro haciendo deporte en el colegio.
- Tasa de retención por programa: cuántos siguen al mes 3, al mes 6.

### Pertenencia e impacto
- Encuesta anual de satisfacción de comunidad (preguntas específicas sobre deporte).
- Correlación entre familias activas en programas deportivos y permanencia en el colegio (medir a fin de año).
- Menciones espontáneas del deporte como razón de elección del colegio en encuestas de matrícula.

### Financiero
- Cada programa cubre al menos sus costos directos desde el mes 4 de operación.
- Ingresos de programas de comunidad como porcentaje del presupuesto total del área.

## Consideraciones legales y de seguros

- Verificar cobertura de seguro para adultos en el recinto o contratar póliza complementaria.
- Formulario de salud y descargo de responsabilidad para cada adulto participante.
- Consentimiento de imagen para fotos y videos (ver carpeta 09, Ley 21.719).

## Vínculo con el posicionamiento del colegio

- Argumento concreto en jornadas de admisión: "Acá los padres también hacen deporte".
- Las familias que participan son embajadores naturales del colegio.
- El deporte comunitario refuerza la identidad institucional más allá del aula.

## Modelo presupuestario

| Programa | Ingreso estimado mensual | Gasto estimado mensual | Balance |
|----------|------------------------|----------------------|---------|
| Running Team (20 participantes) | $200.000 | $150.000 | +$50.000 |
| Clases adultos (15 participantes, 2 sesiones/semana) | $300.000 | $250.000 | +$50.000 |
| Liga interna (40 participantes, semestral) | $400.000 (semestre) | $350.000 (semestre) | +$50.000 |
| Escuela familiar | $0 (gratuita) | $50.000 | -$50.000 |

Los números son referenciales. Lo importante es que el conjunto se autofinancie o tenga un déficit mínimo justificable por su impacto en retención.`},
"kpis-e-informes":{title:"KPIs e informes a rectoría",sectionId:"08",md:`Lo que no se mide no se gestiona, pero lo que se mide mal se gestiona peor. Los indicadores de este documento están pensados para ser pocos, claros y accionables. Si un número no genera una decisión, sobra.

## Principios de medición

- **Pocos indicadores, bien medidos.** Máximo 3-4 KPIs por nivel. Mejor medir 12 cosas bien que 40 a medias.
- **Meta escalonada.** El año 1 no tiene las mismas metas que el año 3. Partir realista y subir.
- **Datos comparables.** Cada medición usa la misma metodología para poder comparar en el tiempo.
- **Transparencia.** El equipo conoce los indicadores y sus metas. No se evalúa en secreto.
- **Sin vanity metrics.** "Número de actividades realizadas" no es un KPI. El impacto de esas actividades sí lo es.

## Indicadores por nivel del modelo

### FORMACIÓN (100% de los alumnos)

| KPI | Fórmula | Meta año 1 | Meta año 3 |
|-----|---------|-----------|-----------|
| Cobertura de evaluación | Alumnos evaluados / matrícula total x 100 | 90% | 100% |
| Mejora del perfil atlético | Alumnos que mejoran vs medición anterior / total evaluados x 100 | 60% | 75% |
| Reporte a familias | Familias que reciben reporte semestral / total familias x 100 | 80% | 100% |

**Cómo se mide:**
- Dos mediciones al año: marzo (entrada) y octubre (salida)
- Batería estandarizada (ver documento perfil-atletico en 02-perfil-deportista)
- Datos cargados en plataforma, no en planillas sueltas

**Qué decisiones alimenta:**
- Si la cobertura es baja: problema de logística o de compromiso docente
- Si la mejora es baja en un curso: revisar la planificación de ese nivel
- Si los reportes no llegan: revisar el proceso, no culpar al docente

### DESARROLLO (talleres y ramas deportivas)

| KPI | Fórmula | Meta año 1 | Meta año 3 |
|-----|---------|-----------|-----------|
| Participación | Alumnos inscritos en al menos 1 taller o rama / matrícula total x 100 | 30% | 50% |
| Retención anual | Alumnos que terminan el año / inscritos al inicio x 100 | 70% | 85% |
| Planificación visible | Ramas con plan anual cargado en plataforma / total ramas x 100 | 50% | 100% |
| Satisfacción | Nota promedio encuesta de satisfacción (escala 1-7) | 5.5 | 6.0 |

**Cómo se mide:**
- Inscripción y asistencia en plataforma (registro semanal)
- Encuesta de satisfacción a alumnos y apoderados al cierre de cada semestre
- Revisión de planificaciones cargadas al inicio de cada semestre

**Qué decisiones alimenta:**
- Participación baja: faltan opciones atractivas, horarios malos o comunicación débil
- Retención baja en una rama: investigar (entrenador, horario, nivel de exigencia)
- Planificación no cargada: el entrenador necesita apoyo o no está cumpliendo el acuerdo

### ELITE (seleccionados y competencia)

| KPI | Fórmula | Meta año 1 | Meta año 3 |
|-----|---------|-----------|-----------|
| Seleccionados con plan individual | Deportistas con plan activo / total seleccionados x 100 | 60% | 100% |
| Índice de lesiones | Lesiones que requieren baja / 100 deportistas por semestre | Línea base | Reducción 20% |
| Resultados deportivos | Posición promedio en competencias oficiales por rama | Línea base | Mejora vs línea base |
| Coordinación académica | Seleccionados con protocolo académico activo / total x 100 | 50% | 90% |

**Cómo se mide:**
- Plan individual documentado y con seguimiento mensual
- Registro de lesiones con clasificación (tipo, gravedad, mecanismo)
- Resultados oficiales de competencias (ADECOP, ligas, torneos)
- Coordinación con dirección académica verificada por escrito

### COMUNIDAD (deporte de adultos e identidad)

| KPI | Fórmula | Meta año 1 | Meta año 3 |
|-----|---------|-----------|-----------|
| Adultos activos | Apoderados y staff participando por mes | 30 | 80 |
| Actividades comunitarias | Eventos deportivos abiertos a la comunidad por semestre | 2 | 4 |
| Impacto en retención | Familias que mencionan deporte como factor de permanencia | Línea base | Mejora vs base |

### GESTIÓN (operación del área)

| KPI | Fórmula | Meta año 1 | Meta año 3 |
|-----|---------|-----------|-----------|
| Ejecución presupuestaria | Gasto real / presupuesto aprobado x 100 | 90-105% | 95-105% |
| Clima del equipo | Nota promedio encuesta interna (escala 1-7) | 5.0 | 6.0 |
| Cumplimiento de planificación | Actividades realizadas / programadas x 100 | 75% | 90% |
| Informes a tiempo | Informes entregados en plazo / comprometidos x 100 | 90% | 100% |

## Tablero resumen

Vista única que consolida los KPIs principales. Se actualiza mensualmente.

**Semáforo por nivel:**
- Verde: en meta o sobre meta
- Amarillo: bajo meta pero con tendencia positiva o plan de acción activo
- Rojo: bajo meta sin plan de acción

## Informes a rectoría

### Informe mensual (una página)
1. **Semáforo:** 5 indicadores clave en verde/amarillo/rojo
2. **Avances del mes:** 3-4 bullets de lo que se logró
3. **Alertas:** lo que no salió como se esperaba y por qué
4. **Próximos hitos:** lo que viene el mes siguiente
5. **Pedidos:** si se necesita algo de rectoría, explícito y con plazo

**Regla de oro:** las malas noticias van primero y siempre con plan de acción incluido.

**Día de entrega:** el último día hábil de cada mes, sin excepción.

### Informe semestral (presentación 15-20 min)
1. Resultados del perfil atlético (comparación entrada vs salida)
2. Participación y retención en Desarrollo
3. Resultados deportivos
4. Ejecución presupuestaria
5. Clima y equipo
6. Plan del próximo semestre

### Informe anual
1. Cumplimiento de KPIs: meta vs real con explicación
2. Evolución respecto al año anterior (a partir del año 2)
3. Casos de éxito
4. Lecciones aprendidas
5. Propuesta para el año siguiente

## Errores comunes a evitar

- **Medir para justificarse.** Los datos son para mejorar, no para demostrar que todo está bien.
- **Cambiar la metodología para mejorar el número.** Se pierde la comparabilidad.
- **Sobrecargar al equipo con registros.** Si un docente pasa más tiempo registrando que enseñando, algo está mal.
- **Informar solo lo bueno.** La confianza de rectoría se gana con transparencia.
- **No actuar sobre los datos.** Cada dato debe conectar con una decisión o una acción.

## Calendario de medición

| Qué | Cuándo | Responsable |
|-----|--------|-------------|
| Perfil atlético entrada | Marzo (semanas 2-3) | Equipo de formación |
| Perfil atlético salida | Octubre (semanas 2-3) | Equipo de formación |
| Encuesta satisfacción | Junio y noviembre | Jefatura de área |
| Encuesta clima equipo | Junio y noviembre | Jefatura de área |
| Revisión planificaciones | Marzo y agosto | Jefatura de área |
| Informe mensual | Último día hábil de cada mes | Jefatura de área |
| Informe semestral | Julio y diciembre | Jefatura de área |
| Informe anual | Enero (mes siguiente) | Jefatura de área |`},
"plan-90-dias":{title:"Plan de los primeros 90 días",sectionId:"08",md:`Los primeros tres meses definen si el proyecto tiene tracción o se queda en un documento bonito. La lógica es simple: primero escuchar, después devolver, después mostrar resultados. En ese orden.

## Mes 1: escuchar y levantar (semanas 1 a 4)

Objetivo: entender cómo funciona el área hoy sin cambiar nada. Llegar con los ojos abiertos y la boca cerrada.

### Semana 1: instalación y contexto
- Reunión con rectoría para alinear expectativas y definir límites del rol
- Presentación al equipo: quién soy, qué vengo a hacer, qué NO voy a hacer todavía
- Recorrido completo de infraestructura con registro (fotos, estado, horarios de uso)
- Recopilar documentos existentes: planes, horarios, presupuestos, reglamentos

### Semana 2: entrevistas individuales al equipo
- Entrevista a cada docente y entrenador del área (pauta en 01-diagnostico)
- Registrar: disposición al cambio, nivel técnico, líderes naturales, temas sensibles
- Regla: solo escuchar y agradecer. Ninguna promesa individual

### Semana 3: observación y catastros
