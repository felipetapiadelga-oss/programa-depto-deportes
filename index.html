<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depto Deportes - Docs</title>
<style>
:root {
  --azul: #1a365d;
  --azul-claro: #2b6cb0;
  --azul-hover: #2c5282;
  --gris-fondo: #f7fafc;
  --gris-borde: #e2e8f0;
  --gris-texto: #4a5568;
  --verde: #276749;
  --verde-bg: #f0fff4;
  --rojo: #c53030;
  --sidebar-w: 270px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--gris-fondo);color:#1a202c}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--azul);color:#fff;display:flex;flex-direction:column;z-index:10}
.sidebar-header{padding:1.2rem 1rem .8rem;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sidebar-header h1{font-size:.95rem;font-weight:700}
.sidebar-header p{font-size:.7rem;opacity:.5;margin-top:.15rem}
.search-box{padding:.5rem 1rem;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.search-box input{width:100%;padding:.4rem .6rem;border:none;border-radius:4px;background:rgba(255,255,255,.12);color:#fff;font-size:.78rem;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,.4)}
.search-box input:focus{background:rgba(255,255,255,.2)}
.nav-scroll{flex:1;overflow-y:auto;padding-bottom:1rem}
.nav-section{margin-top:.4rem}
.nav-section-head{display:flex;align-items:center;padding:.4rem 1rem .15rem;gap:.3rem}
.nav-section-title{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;opacity:.4;font-weight:600;flex:1}
.nav-sec-btn{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.75rem;padding:0 .15rem;line-height:1}
.nav-sec-btn:hover{color:rgba(255,255,255,.7)}
.nav-item{display:flex;align-items:center;gap:.4rem;padding:.35rem 1rem .35rem 1.3rem;font-size:.78rem;color:rgba(255,255,255,.7);cursor:pointer;transition:background .12s;border-left:3px solid transparent;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#63b3ed;font-weight:600}
.nav-item.home-link{padding-left:1rem;font-weight:600;color:rgba(255,255,255,.9);border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:.5rem;margin-bottom:.2rem}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.nav-dot.empty{border:1.5px solid rgba(255,255,255,.3)}
.nav-dot.edited{background:#48bb78}
.nav-dot.nuevo{background:#63b3ed}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item-del{display:none;background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.7rem;padding:0 .1rem}
.nav-item:hover .nav-item-del{display:block}
.nav-item-del:hover{color:#fc8181}
.sidebar-footer{padding:.6rem 1rem;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;display:flex;gap:.4rem;flex-wrap:wrap}
.sidebar-btn{flex:1;padding:.35rem;border:1px solid rgba(255,255,255,.2);border-radius:4px;background:none;color:rgba(255,255,255,.7);font-size:.65rem;cursor:pointer;transition:background .12s;min-width:0;white-space:nowrap}
.sidebar-btn:hover{background:rgba(255,255,255,.1);color:#fff}

/* MAIN */
.main{margin-left:var(--sidebar-w);min-height:100vh}
.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--gris-borde);padding:.6rem 2rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.breadcrumb{font-size:.75rem;color:var(--gris-texto);flex:1}
.breadcrumb b{color:var(--azul)}
.tb{padding:.35rem .7rem;border:1px solid var(--gris-borde);border-radius:5px;background:#fff;font-size:.72rem;cursor:pointer;color:var(--gris-texto);font-weight:500;transition:all .12s}
.tb:hover{border-color:var(--azul-claro);color:var(--azul-claro)}
.tb.primary{background:var(--azul);color:#fff;border-color:var(--azul)}
.tb.primary:hover{background:var(--azul-hover)}
.tb.danger{color:var(--rojo)}
.tb.danger:hover{border-color:var(--rojo)}
.status-pill{font-size:.63rem;padding:.18rem .5rem;border-radius:10px;font-weight:600}
.status-pill.editado{background:var(--verde-bg);color:var(--verde)}
.status-pill.original{background:#edf2f7;color:#718096}
.status-pill.nuevo{background:#ebf8ff;color:#2b6cb0}

/* CONTENT */
.content-area{padding:1.5rem 2rem 4rem;max-width:850px}
.doc-view h1{font-size:1.5rem;color:var(--azul);margin-bottom:.3rem}
.doc-view h2{font-size:1.15rem;color:var(--azul);margin-top:1.6rem;margin-bottom:.4rem;border-bottom:2px solid var(--gris-borde);padding-bottom:.25rem}
.doc-view h3{font-size:.95rem;color:var(--azul-claro);margin-top:1.2rem;margin-bottom:.3rem}
.doc-view p{line-height:1.6;margin-bottom:.5rem;color:var(--gris-texto)}
.doc-view ul,.doc-view ol{margin:.3rem 0 .7rem 1.3rem;color:var(--gris-texto)}
.doc-view li{margin-bottom:.25rem;line-height:1.5}
.doc-view strong{color:#1a202c}
.doc-view code{background:#edf2f7;padding:.15rem .4rem;border-radius:3px;font-size:.85em}
.doc-view blockquote{border-left:3px solid var(--azul-claro);padding:.5rem 1rem;margin:.8rem 0;background:#ebf8ff;color:var(--azul)}
.doc-view a{color:var(--azul-claro);text-decoration:underline;font-weight:500}
.doc-view a:hover{color:var(--azul)}
.por-levantar{background:#fefcbf;color:#975a16;padding:.1rem .4rem;border-radius:3px;font-weight:600;font-size:.85em}
.md-table{width:100%;border-collapse:collapse;margin:.8rem 0 1rem;font-size:.82rem}
.md-table th{background:var(--azul);color:#fff;padding:.45rem .6rem;text-align:left;font-weight:600;font-size:.75rem}
.md-table td{padding:.4rem .6rem;border-bottom:1px solid var(--gris-borde);color:var(--gris-texto)}
.md-table tr:nth-child(even) td{background:#f7fafc}
.md-table tr:hover td{background:#edf2f7}

/* EDITOR */
.editor-wrap{display:flex;gap:0;height:calc(100vh - 52px)}
.editor-pane{flex:1;display:flex;flex-direction:column}
.editor-pane-label{font-size:.63rem;text-transform:uppercase;letter-spacing:.06em;padding:.4rem 1rem;background:#edf2f7;color:#718096;font-weight:600;border-bottom:1px solid var(--gris-borde)}
.editor-textarea{flex:1;width:100%;border:none;padding:1.2rem 1.5rem;font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:.82rem;line-height:1.7;resize:none;outline:none;background:#fafbfc;color:#1a202c;tab-size:2}
.preview-pane{flex:1;overflow-y:auto;border-left:1px solid var(--gris-borde)}
.preview-content{padding:1.2rem 1.5rem}
.editor-only .preview-pane{display:none}

/* DASHBOARD */
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem;margin-top:1rem}
.dash-card{background:#fff;border:1px solid var(--gris-borde);border-radius:8px;padding:1rem;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.dash-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06);border-color:var(--azul-claro)}
.dash-card h3{font-size:.82rem;color:var(--azul);margin:0 0 .2rem}
.dash-card p{font-size:.72rem;color:var(--gris-texto);margin:0}
.dash-card .badge{display:inline-block;font-size:.6rem;padding:.1rem .4rem;border-radius:10px;margin-bottom:.4rem;font-weight:600}
.badge-0{background:#ebf8ff;color:#2b6cb0}.badge-1{background:#fefcbf;color:#975a16}.badge-2{background:#f0fff4;color:#276749}
.badge-3{background:#fed7e2;color:#97266d}.badge-4{background:#e9d8fd;color:#553c9a}.badge-5{background:#feebc8;color:#c05621}
.badge-6{background:#bee3f8;color:#2a4365}.badge-7{background:#c6f6d5;color:#22543d}.badge-8{background:#fefcbf;color:#744210}
.badge-9{background:#fed7d7;color:#9b2c2c}
.progress-row{display:flex;align-items:center;gap:.5rem;margin-top:.4rem}
.progress-bar{flex:1;height:4px;background:#edf2f7;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#48bb78;border-radius:2px;transition:width .3s}
.progress-text{font-size:.65rem;color:#a0aec0}

/* MODELO */
.modelo-visual{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:1.2rem 0}
.modelo-nivel{background:#fff;border-radius:8px;padding:1rem;border-left:4px solid;text-align:center}
.modelo-nivel h4{font-size:.85rem;margin-bottom:.2rem}
.modelo-nivel p{font-size:.72rem;color:var(--gris-texto);margin:0}
.nivel-formacion{border-color:#48bb78}.nivel-desarrollo{border-color:#4299e1}.nivel-elite{border-color:#ed8936}
.modelo-comunidad{background:#fff;border:2px dashed #9f7aea;border-radius:8px;padding:.8rem;text-align:center;margin-bottom:1rem}
.modelo-comunidad h4{color:#553c9a;font-size:.85rem;margin-bottom:.15rem}
.modelo-comunidad p{font-size:.72rem;color:var(--gris-texto);margin:0}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:10px;padding:1.5rem;width:380px;max-width:90vw;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.modal h3{font-size:1rem;color:var(--azul);margin-bottom:1rem}
.modal label{display:block;font-size:.75rem;color:var(--gris-texto);margin-bottom:.25rem;margin-top:.7rem}
.modal input,.modal select{width:100%;padding:.45rem .6rem;border:1px solid var(--gris-borde);border-radius:5px;font-size:.82rem;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--azul-claro)}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.2rem}
.modal-actions button{padding:.4rem 1rem;border-radius:5px;font-size:.78rem;cursor:pointer;border:1px solid var(--gris-borde);background:#fff;color:var(--gris-texto)}
.modal-actions .modal-ok{background:var(--azul);color:#fff;border-color:var(--azul)}
.modal-actions .modal-ok:hover{background:var(--azul-hover)}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1a202c;color:#fff;padding:.6rem 1.2rem;border-radius:6px;font-size:.8rem;opacity:0;transform:translateY(10px);transition:all .3s;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}

/* NEW DOC PLACEHOLDER */
.empty-doc{text-align:center;padding:4rem 2rem;color:#a0aec0}
.empty-doc h2{font-size:1.1rem;margin-bottom:.5rem;color:#718096}
.empty-doc p{font-size:.85rem}
.empty-doc button{margin-top:1rem;padding:.5rem 1.5rem;background:var(--azul);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}
.empty-doc button:hover{background:var(--azul-hover)}

.hidden{display:none!important}
@media print{.sidebar,.toolbar{display:none}.main{margin-left:0}}

/* MOBILE */
.menu-toggle{display:none;position:fixed;top:.6rem;left:.6rem;z-index:20;background:var(--azul);color:#fff;border:none;border-radius:6px;width:38px;height:38px;font-size:1.2rem;cursor:pointer;line-height:1}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9}

@media(max-width:768px){
  .menu-toggle{display:block}
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:20}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block;z-index:15}
  .main{margin-left:0}
  .toolbar{padding:.6rem 1rem .6rem 3.2rem;gap:.4rem}
  .breadcrumb{font-size:.7rem;min-width:0}
  .tb{padding:.3rem .5rem;font-size:.65rem}
  .status-pill{font-size:.58rem;padding:.15rem .4rem}
  .content-area{padding:1rem 1rem 3rem}
  .doc-view h1{font-size:1.2rem}
  .doc-view h2{font-size:1rem;margin-top:1.2rem}
  .doc-view h3{font-size:.88rem}
  .doc-view p,.doc-view li{font-size:.85rem}
  .doc-view ul,.doc-view ol{margin-left:1rem}
  .dashboard-grid{grid-template-columns:1fr}
  .modelo-visual{grid-template-columns:1fr;gap:.5rem}
  .modelo-nivel{padding:.8rem}
  .editor-wrap{flex-direction:column;height:calc(100vh - 48px)}
  .editor-wrap .preview-pane{display:none}
  .editor-textarea{font-size:.78rem;padding:.8rem 1rem}
  .modal{width:92vw;padding:1.2rem}
  .toast{bottom:1rem;right:1rem;left:1rem;text-align:center}
  .sidebar-footer{gap:.3rem}
  .sidebar-btn{font-size:.6rem;padding:.3rem}
}

/* FORMS */
.form-area{max-width:700px}
.form-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
.form-header h1{font-size:1.4rem;color:var(--azul);margin:0}
.form-actions{display:flex;gap:.4rem;flex-wrap:wrap}
.form-btn{padding:.4rem .9rem;border-radius:5px;font-size:.75rem;cursor:pointer;font-weight:600;border:1px solid var(--gris-borde);background:#fff;color:var(--gris-texto);transition:all .12s}
.form-btn:hover{border-color:var(--azul-claro);color:var(--azul-claro)}
.form-btn.primary{background:var(--azul);color:#fff;border-color:var(--azul)}
.form-btn.primary:hover{background:var(--azul-hover)}
.form-btn.success{background:var(--verde);color:#fff;border-color:var(--verde)}
.form-btn.success:hover{background:#22543d}
.form-btn.danger{color:var(--rojo);border-color:var(--rojo)}
.form-btn.danger:hover{background:#fff5f5}
.form-saved-msg{font-size:.72rem;color:var(--verde);font-weight:600;opacity:0;transition:opacity .3s}
.form-saved-msg.visible{opacity:1}
.form-group{margin-bottom:.9rem}
.form-group label{display:block;font-size:.78rem;color:var(--azul);font-weight:600;margin-bottom:.25rem}
.form-group input[type="text"],
.form-group input[type="date"],
.form-group textarea,
.form-group select{width:100%;padding:.5rem .7rem;border:1px solid var(--gris-borde);border-radius:5px;font-size:.82rem;font-family:inherit;outline:none;background:#fff;color:#1a202c;transition:border-color .15s}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{border-color:var(--azul-claro);box-shadow:0 0 0 2px rgba(43,108,176,.1)}
.form-group textarea{min-height:80px;resize:vertical;line-height:1.5}
.form-group select{cursor:pointer}

/* ROSTER */
.roster-cards{display:flex;flex-direction:column;gap:1rem}
.roster-card{background:#fff;border:1px solid var(--gris-borde);border-radius:8px;padding:1rem 1.2rem;position:relative;transition:box-shadow .15s}
.roster-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.roster-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--gris-borde)}
.roster-card-num{font-size:.85rem;font-weight:700;color:var(--azul)}
.roster-card .form-group{margin-bottom:.6rem}
.roster-card .form-group label{font-size:.72rem}
.roster-card .form-group input,
.roster-card .form-group select,
.roster-card .form-group textarea{font-size:.78rem;padding:.4rem .6rem}
.roster-card .form-group textarea{min-height:55px}
.roster-empty{text-align:center;padding:2rem;color:#a0aec0;font-size:.85rem}
.roster-count{font-size:.75rem;color:var(--gris-texto);margin-bottom:.8rem}

@media(max-width:768px){
  .form-area{padding:0}
  .form-header{flex-direction:column;align-items:flex-start}
  .form-header h1{font-size:1.15rem}
  .form-actions{width:100%}
  .form-actions .form-btn{flex:1;text-align:center}
  .form-group label{font-size:.75rem}
  .form-group input[type="text"],
  .form-group input[type="date"],
  .form-group textarea,
  .form-group select{font-size:.85rem;padding:.55rem .7rem}
  .form-group textarea{min-height:90px}
  .roster-card{padding:.8rem}
}

@media print{
  .form-actions{display:none}
  .form-group input,
  .form-group textarea,
  .form-group select{border:none;padding:0;font-size:.8rem;background:transparent}
  .form-group textarea{min-height:auto;resize:none}
  .roster-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="position:fixed;inset:0;background:var(--azul);z-index:999;display:flex;align-items:center;justify-content:center">
  <div style="text-align:center;width:300px">
    <h1 style="color:#fff;font-size:1.3rem;margin-bottom:.3rem">Depto Deportes</h1>
    <p style="color:rgba(255,255,255,.5);font-size:.75rem;margin-bottom:2rem">Colegio particular, sector oriente</p>
    <input type="password" id="login-pass" placeholder="Clave de acceso" style="width:100%;padding:.6rem 1rem;border:none;border-radius:6px;font-size:.9rem;outline:none;background:rgba(255,255,255,.12);color:#fff;text-align:center" onkeydown="if(event.key==='Enter')checkLogin()">
    <button onclick="checkLogin()" style="width:100%;margin-top:.8rem;padding:.6rem;background:#63b3ed;color:#fff;border:none;border-radius:6px;font-size:.85rem;cursor:pointer;font-weight:600">Entrar</button>
    <p id="login-error" style="color:#fc8181;font-size:.75rem;margin-top:.8rem;opacity:0">Clave incorrecta</p>
  </div>
</div>
<script>
const _h='Iag[(*\'#';function _d(s){return s.split('').map((c,i)=>String.fromCharCode(c.charCodeAt(0)+i+7)).join('')}
function checkLogin(){
  const p=document.getElementById('login-pass').value;
  if(p===_d(_h)){
    document.getElementById('login-screen').style.display='none';
    sessionStorage.setItem('dd-auth','1');
  } else {
    document.getElementById('login-error').style.opacity='1';
    document.getElementById('login-pass').value='';
    setTimeout(()=>document.getElementById('login-error').style.opacity='0',2000);
  }
}
if(sessionStorage.getItem('dd-auth')==='1') document.getElementById('login-screen').style.display='none';
else document.getElementById('login-pass').focus();
</script>

<script>
// =====================================================
// DATA
// =====================================================
const DEFAULT_SECTIONS = [
  {id:"00",name:"Estrategia"},{id:"01",name:"Diagnóstico"},{id:"02",name:"Perfil deportista"},
  {id:"03",name:"Docentes"},{id:"04",name:"Planes"},{id:"05",name:"Competencias"},
  {id:"06",name:"Infraestructura y presupuesto"},{id:"07",name:"Comunidad"},
  {id:"08",name:"Gestión y KPIs"},{id:"09",name:"Administración y normativa"},
  {id:"F0",name:"Formularios diagnóstico"}
];

const DEFAULT_DOCS = {
"plan-maestro":{title:"Plan Maestro del Departamento",sectionId:"00",md:`Documento madre del proyecto. De aquí cuelgan todos los demás documentos de la carpeta. Origen: dictado de Felipe, organizado y con agregados marcados como (+).

## 0. Objetivo de la comunidad

Antes de definir nada, responder estas preguntas con el colegio:

- Qué queremos del deporte como comunidad educativa
- Cómo integramos el deporte a toda la comunidad (alumnos, docentes, apoderados, staff)
- Cuál es la visión del departamento (dónde queremos estar en 5 años)
- Cuál es la misión del departamento (qué hacemos todos los días para llegar ahí)
- (+) Qué NO queremos ser (define límites y evita malas prácticas desde el día uno)
- (+) Cómo se conecta el deporte con el proyecto educativo y el perfil de egreso del colegio

**Regla:** visión y misión se redactan DESPUÉS de escuchar, nunca antes.

## 1. Perfil del alumno

Se arma sabiendo ya cuál es el objetivo de la comunidad. Base: el perfil que ya tenemos desarrollado, en sus cuatro dimensiones:

1. Motriz
2. Cognitivo
3. Físico
4. Actitudinal

Características: medible curso a curso, exigente y realista, visible para familias.

(+) Cada dimensión con evaluación de entrada y salida anual, registrada en plataforma para seguimiento longitudinal del alumno completo (prekínder a IV medio).

## 2. Área Docentes

### Dos niveles de docentes que deben mezclarse

**Especialistas:** con experiencia, salen del deporte, dan el valor agregado.

**En proyección:** motivación, hambre y ganas de aprender. Los mueve el desafío, quieren llegar a ser especialistas. Proyectables y moldeables.

(+) La mezcla es deliberada: los especialistas forman a los proyectables. Cada especialista con al menos un docente en proyección a su cargo (mentoría interna).

### Gestión del equipo

"tesis-y-modelo":{title:"Tesis y modelo",sectionId:"00",md:`## La tesis

En el deporte escolar chileno hay un lugar vacante.

Los colegios que compiten bien generalmente lo hacen a costa de la formación: concentran recursos en pocas ramas, priorizan resultados sobre procesos y dejan al 80% de los alumnos con una clase de educación física que no los marca. Los que forman bien rara vez compiten: tienen buenos programas pero no logran resultados deportivos que posicionen al colegio.

El colegio que logre hacer las dos cosas a la vez, formar al 100% de sus alumnos con un perfil atlético medible y competir con seriedad en las ramas que elija, con un proyecto profesional y de largo plazo, será la referencia del país.

Ninguna familia debería buscar fuera lo que puede encontrar dentro del colegio. Hoy muchas lo hacen: pagan clubes, academias y entrenadores particulares porque el colegio no les ofrece un camino deportivo con progresión, datos y profesionalismo. Esa fuga es la evidencia de una demanda no cubierta y una oportunidad concreta para el colegio que decida tomarla.

## El modelo: tres niveles y una comunidad

El modelo tiene tres niveles secuenciales y una capa transversal. Cada alumno entra por Formación. Los que quieren más avanzan a Desarrollo. Los que tienen condiciones y ambición llegan a Elite. La Comunidad envuelve todo.

### Nivel 1: FORMACIÓN (100% de los alumnos)

Qué es: el programa de Educación Física del colegio, rediseñado para que cada alumno egrese cumpliendo un perfil atlético medible curso a curso. No es solo "hacer la clase": es un sistema donde se evalúa, se registra y se hace seguimiento del desarrollo motor y físico de todos.

- Aplica desde prekinder hasta IV medio
- Se mide con baterías de evaluación validadas (entrada en marzo, salida en octubre)
- Cada alumno tiene un registro longitudinal de su desarrollo
- Los datos alimentan decisiones: si un curso está bajo en coordinación, se ajusta el plan
- Los apoderados reciben reporte de avance dos veces al año

Respaldo: el concepto de Physical Literacy (Whitehead, 2010) y las baterías ALPHA (Ruiz et al., 2011) fundamentan que todos los niños deben alcanzar competencias motrices mínimas medibles en contexto escolar.

### Nivel 2: DESARROLLO (el que elige un deporte)

Qué es: talleres y ramas deportivas con progresión real. El alumno que quiere ir más allá de la clase encuentra un camino estructurado: taller inicial, intermedio, preselección, selección.

- Cada rama tiene un plan anual por escrito con progresiones técnicas por categoría
- Cargas semanales adecuadas a la edad (no se entrena igual a un alumno de 10 que a uno de 16)
- Criterios de selección transparentes y conocidos por alumnos y familias
- Docentes y entrenadores con planificación visible en plataforma
- Registro de asistencia y evolución de cada deportista

Respaldo: el modelo DMSP de Cote (2014) y el LTAD de Balyi (2013) establecen que el desarrollo deportivo tiene etapas y que forzar especialización temprana es contraproducente. El camino multideporte produce mejores deportistas a largo plazo (Myer et al., 2015).

### Nivel 3: ELITE (apoyo real al que quiere más)

Qué es: un protocolo de apoyo individual para el alumno que tiene condiciones y ambición de competir a nivel alto. No es inventar un centro de alto rendimiento dentro del colegio. Es darle al deportista lo que necesita sin que tenga que irse.

- Horarios especiales: gimnasio 7 a 8 AM con preparador físico a cargo
- Coordinación académica para compatibilizar entrenamientos y evaluaciones
- Evaluación preventiva de lesiones con kinesiólogo
- Puente con clubes y federaciones cuando el nivel del alumno supera lo que el colegio puede ofrecer
- Plan individual por escrito, con metas y seguimiento

Respaldo: el principio de "ganar bien" se apoya en la evidencia sobre los riesgos de la especialización temprana y el sobreentrenamiento en menores (DiFiori et al., 2014; LaPrade et al., 2016). Elite no significa malas prácticas.

### Capa transversal: COMUNIDAD

Qué es: apoderados y staff haciendo deporte en el colegio. No es un extra ni un negocio: es identidad, pertenencia y la mejor publicidad que existe.

- Running team institucional, ligas internas, clases para adultos en horarios valle
- Horarios que no compiten con el uso escolar
- Autofinanciado o con costo simbólico
- Docentes del área con horas extra pagadas (nadie trabaja gratis)

Valor: una familia que hace deporte en el colegio no se va. Un padre que entrena los sábados en la cancha del colegio habla del colegio el lunes en la oficina.

## Cómo se conectan los niveles

El camino es de abajo hacia arriba y nadie se salta etapas:

- Formación detecta: los datos del perfil atlético identifican alumnos con condiciones para invitarlos a Desarrollo
- Desarrollo prepara: la progresión por ramas construye el deportista que eventualmente puede llegar a Elite
- Elite conecta: cuando un alumno supera el techo del colegio, se le ayuda a dar el salto a clubes o federaciones en vez de retenerlo artificialmente

Lo que baja:
- Los datos de Desarrollo y Elite retroalimentan la planificación de Formación
- Los seleccionados son referentes visibles para los alumnos en Formación
- Comunidad genera el ecosistema donde todo esto tiene sentido y sostenibilidad

## Principios de gestión

**Aportar, no criticar lo existente.** Este proyecto suma sobre lo que hay. Ningún documento, presentación o conversación puede leerse como crítica a la gestión actual. El framing es siempre "potenciar" y "construir sobre".

**Ganar bien.** Elite sin malas prácticas. No se adelantan categorías para ganar torneos. No se sobrecargan menores. No se presiona académicamente a seleccionados. Los resultados se buscan haciendo las cosas bien, no tomando atajos.

**Multideporte primero, especialización a su tiempo.** La evidencia es clara: especializar antes de los 12-13 años aumenta lesiones, abandono y burnout. El colegio promueve la práctica de múltiples deportes en los ciclos menores y acompaña la especialización cuando corresponde por edad y desarrollo.

**Decisiones con datos, no con impresiones.** El perfil atlético se mide. La asistencia se registra. Las lesiones se documentan. El presupuesto se controla. Los informes a rectoría llevan números, no anécdotas. Para eso existen las plataformas propias (SCM, CoachDrill, AutoCut).

**El colegio conecta, no retiene.** Cuando un deportista alcanza un nivel que supera lo que el colegio puede ofrecer, se le ayuda a conectar con clubes y federaciones. Retenerlo sería frenar su desarrollo. Que un exalumno compita a nivel nacional o internacional ES un resultado del colegio.

## Lo que este proyecto NO es

- No es un club deportivo dentro del colegio. Es un departamento del colegio con estándares profesionales.
- No es un programa solo para seleccionados. El 100% de los alumnos está incluido desde Formación.
- No es una crítica a lo que se hace hoy. Es una propuesta de evolución.
- No es un proyecto que necesita infraestructura nueva para empezar. Se trabaja con lo que hay y se mejora en el camino.
- No es un gasto. Es una inversión con retorno medible en retención de familias, posicionamiento y resultados.

## Propuesta de valor para el colegio

**Para las familias:** un programa deportivo con la misma seriedad que el programa académico. Datos de sus hijos, progresión visible, profesionales a cargo. Razón para no buscar afuera.

**Para el colegio:** diferenciación real en un mercado donde todos los colegios particulares del sector oriente dicen tener "buen deporte" pero pocos pueden demostrarlo con datos. Retención de familias que hoy gastan en deporte externo. Posicionamiento como referente.

**Para los docentes:** un proyecto con estructura, indicadores y acompañamiento. Saber qué se espera de ellos, con qué recursos cuentan y cómo se mide su trabajo. Desarrollo profesional real.

**Para los alumnos:** un camino deportivo claro desde que entran al colegio hasta que egresan. Saber dónde están, hacia dónde pueden ir y qué necesitan para llegar.

## Archivos de referencia

Guardar aquí la presentación enviada (PDF) y la carta original.
Ver documento de bibliografía y fundamentos para las fuentes que respaldan cada componente del modelo.`},
"bibliografia-y-fundamentos":{title:"Bibliografía y fundamentos",sectionId:"00",md:`Referencias que respaldan cada pilar del modelo. Solo fuentes verificables y reconocidas.

## Desarrollo deportivo a largo plazo (LTAD)

Base teórica del modelo de tres niveles (Formación, Desarrollo, Elite).

- Balyi, I., Way, R. & Higgs, C. (2013). Long-Term Athlete Development. Human Kinetics. [Ver en editorial](https://us.humankinetics.com/products/long-term-athlete-development)
- Sport for Life Society (2019). Long-Term Development in Sport and Physical Activity 3.0. CS4L. [PDF gratis](https://sportforlife.ca/wp-content/uploads/2019/06/Long-Term-Development-in-Sport-and-Physical-Activity-3.0.pdf)
- Cote, J. & Vierimaa, M. (2014). The developmental model of sport participation: 15 years after its first conceptualization. Science & Sports, 29, S63-S69. [PDF gratis](https://digitalcommons.usu.edu/hper_facpub/105)
- Lloyd, R.S. & Oliver, J.L. (Eds.) (2020). Strength and Conditioning for Young Athletes (2da ed.). Routledge. [Ver en editorial](https://www.routledge.com/Strength-and-Conditioning-for-Young-Athletes-Science-and-Application/Lloyd-Oliver/p/book/9780815361831)

Qué respaldan: la idea de que el camino deportivo tiene etapas diferenciadas y que cada una necesita objetivos, métodos y evaluaciones distintas. Forzar competencia o especialización temprana es contraproducente.

## Multideporte y riesgos de la especialización temprana

Base para el principio "multideporte primero, especialización a su tiempo".

- Myer, G.D. et al. (2015). Sports Specialization, Part I. Sports Health, 7(5), 437-442. [PDF gratis](https://dash.harvard.edu/bitstreams/7312037e-0ac7-6bd4-e053-0100007fdf3b/download)
- LaPrade, R.F. et al. (2016). AOSSM Early Sport Specialization Consensus Statement. Orthopaedic Journal of Sports Medicine, 4(4). [PDF gratis](https://journals.sagepub.com/doi/full/10.1177/2325967116644241)
- DiFiori, J.P. et al. (2014). Overuse injuries and burnout in youth sports. British Journal of Sports Medicine, 48(4), 287-288. [Ver en PubMed](https://pubmed.ncbi.nlm.nih.gov/24366013/)
- Cote, J., Baker, J. & Abernethy, B. (2007). Practice and play in the development of sport expertise. Handbook of Sport Psychology (3ra ed.). Wiley. [Ver en editorial](https://onlinelibrary.wiley.com/doi/10.1002/9781118270011.ch8)

Qué respaldan: la evidencia es clara. Especializar antes de los 12-13 años aumenta lesiones, abandono y burnout sin mejorar las probabilidades de éxito deportivo. El camino multideporte produce mejores resultados a largo plazo.

## Alfabetización física (Physical Literacy)

Base para el nivel Formación: perfil atlético medible para el 100% de los alumnos.

- Whitehead, M. (2010). Physical Literacy: Throughout the Lifecourse. Routledge. [Ver en editorial](https://www.routledge.com/Physical-Literacy-Throughout-the-Lifecourse/Whitehead/p/book/9780415487436)
- Tremblay, M.S. et al. (2018). Global Matrix 3.0 Physical Activity Report Card. Journal of Physical Activity and Health, 15(S2), S251-S273. [PDF gratis](https://strathprints.strath.ac.uk/66253/1/Aubert_etal_JPAH_2018_Global_matrix_3_0_physical_activity_report_card_grades_for_children.pdf)
- Longmuir, P.E. et al. (2015). The Canadian Assessment of Physical Literacy (CAPL). BMC Public Health, 15, 767. [PDF gratis](https://pmc.ncbi.nlm.nih.gov/articles/PMC4532252/)

Qué respaldan: la idea de que todos los niños deben alcanzar un nivel mínimo de competencia motriz y condición física, medible y comparable en el tiempo. No es solo para los que "se les da bien el deporte".

## Evaluación física en edad escolar

Base para las baterías de evaluación y el perfil del deportista.

- Ortega, F.B. et al. (2008). Physical fitness in childhood and adolescence: a powerful marker of health. International Journal of Obesity, 32, 1-11. [Ver en Nature](https://www.nature.com/articles/0803774)
- Ruiz, J.R. et al. (2011). ALPHA health-related fitness test battery for children and adolescents. British Journal of Sports Medicine, 45(6), 518-524. [PDF gratis](https://profith.ugr.es/wp-content/uploads/2022/10/INGLES-1.pdf)
- Castro-Pinero, J. et al. (2009). Criterion-related validity of field-based fitness tests in youth. British Journal of Sports Medicine. [Ver en PubMed](https://pubmed.ncbi.nlm.nih.gov/19364756/)

Qué respaldan: existen baterías validadas, aplicables en contexto escolar con recursos mínimos, que permiten hacer seguimiento longitudinal del desarrollo físico de los alumnos. No es necesario inventar tests.

## Gestión y liderazgo deportivo escolar

Base para el enfoque de gestión profesional del área.

- Burton, L.J. & Peachey, J.W. (2014). Organizational culture mediates the relationship between transformational leadership and work outcomes. Journal of Intercollegiate Sport, 7(2). [PDF gratis](https://journals.ku.edu/jis/article/view/10163)
- Light, R.L. (2013). Game Sense: Pedagogy for Performance, Participation and Enjoyment. Routledge. [Ver en editorial](https://www.routledge.com/Game-Sense-Pedagogy-for-Performance-Participation-and-Enjoyment/Light/p/book/9780415532884)
- Lara-Bercial, S. et al. (2017). International Sport Coaching Framework Version 1.2. ICCE. [PDF gratis](https://www.olympics.com/athlete365/app/uploads/2022/04/iscf-1.2-10-7-15.pdf)

Qué respaldan: el área deportiva de un colegio necesita gestión profesional con indicadores, planificación y acompañamiento docente, igual que cualquier otra área del colegio.

## Marco curricular chileno

Alineación con el currículum nacional.

- MINEDUC Chile. Bases Curriculares Educación Física y Salud, 1ro básico a II medio. [Ver en Currículum Nacional](https://www.curriculumnacional.cl/portal/Educacion-General/Educacion-fisica-y-salud/)
- Instituto Nacional de Deportes (IND). Política Nacional de Actividad Física y Deporte 2016-2025. [PDF gratis](https://transparencia.mindep.cl/document/7LDdw7Xd1Y.pdf)

Qué respaldan: el proyecto no reemplaza el currículum, lo potencia. Los objetivos de aprendizaje del MINEDUC se cumplen y se superan dentro del modelo de tres niveles.

## Protección de datos de menores

Base para la gestión responsable de datos.

- Ley 21.719 sobre Protección de Datos Personales (Chile, 2024). [Ver texto oficial](https://www.bcn.cl/leychile/navegar?idNorma=1209272)
- Reglamento General de Protección de Datos (GDPR), Unión Europea, como referencia de mejores prácticas.

Qué respaldan: cualquier plataforma que maneje datos de menores debe cumplir con consentimiento informado, minimización y derecho de acceso. Llegar con esto resuelto es un diferenciador.

## Nota importante

Esta bibliografía no es decorativa. Cada referencia está aquí porque respalda una decisión concreta del modelo. Si se agrega un nuevo componente al proyecto, debe poder asociarse a evidencia. Si no se encuentra respaldo, hay que cuestionar si es una buena idea o solo una ocurrencia.`},
"benchmark-colegios-zona":{title:"Benchmark colegios de la zona",sectionId:"01",md:`Objetivo: entender el entorno competitivo para identificar oportunidades de diferenciación.
Registrar lo que ya se sabe del circuito y completar con datos públicos.

## Nota importante sobre confidencialidad

Este documento es de uso interno. En versiones que se compartan con dirección o apoderados:
- Usar nombres genéricos: "Colegio A (sector oriente)", "Colegio B (Chicureo)", etc.
- No hacer juicios de valor sobre personas de otros colegios.
- Enfocarse en oportunidades propias, no en debilidades ajenas.

En la versión de trabajo interna se pueden usar nombres reales para mayor claridad.

---

## Metodología para recopilar información (inteligencia competitiva ética)

### Fuentes legítimas
- **Páginas web y RRSS de los colegios:** Oferta deportiva, infraestructura, noticias de logros.
- **Resultados públicos de torneos:** ADECOP, ligas escolares, federaciones, resultados en prensa.
- **Conocimiento del equipo interno:** Los profesores y entrenadores conocen el circuito. Preguntarles en las entrevistas.
- **Apoderados:** La encuesta de familias pregunta qué ofrecen otros colegios. Esa información es oro.
- **Eventos deportivos:** Asistir a torneos como observador. Ver niveles, cantidad de deportistas, organización.
- **Redes de contacto:** Conversaciones informales con colegas de otros colegios (sin pedir información confidencial).

### Lo que NO se hace
- No contactar a empleados de otros colegios para extraer información interna.
- No infiltrarse en actividades cerradas.
- No difundir este análisis fuera del colegio.

"catastro-docentes-horas":{title:"Catastro de docentes y horas",sectionId:"01",md:`Objetivo: tener una foto completa del equipo humano del área deportiva.

"pauta-entrevista-apoderados-alumnos":{title:"Voz de apoderados y alumnos",sectionId:"01",md:`Objetivo: medir la demanda real, dentro y fuera del colegio.
Insumo directo para Fase 2 (Personas) y para el diseño del Área 6 (Comunidad) del Plan Maestro.

---

## Metodología

### Apoderados
- **Instrumento:** Encuesta online (Google Forms o similar), máximo 10 minutos de respuesta.
- **Muestra mínima:** 30% de las familias del colegio. Si el colegio tiene 500 familias, apuntar a 150+ respuestas.
- **Selección:** Enviar a todos; no filtrar. La tasa de respuesta ya es un dato (familias comprometidas vs desconectadas).
- **Distribución:** Vía canal oficial del colegio (mail, app, plataforma). Pedir apoyo de dirección para que tenga respaldo institucional.
- **Plazo:** Dejar abierta 5–7 días. Enviar un recordatorio al día 3.
- **Complemento presencial:** Si la tasa de respuesta es baja, hacer 5–10 entrevistas breves en la salida del colegio.
- **Anonimato:** La encuesta debe ser anónima para obtener respuestas honestas. Solo pedir ciclo del hijo/a.

### Alumnos
- **Instrumento:** Encuesta en papel o digital durante hora de clase (coordinado con profesor jefe).
- **Muestra:** Un curso por nivel como mínimo. Ideal: todos los cursos.
- **Segmentación:** Separar respuestas por ciclo (Pre-kínder a 2do básico / 3ro a 6to básico / 7mo a IV medio).
- **Nota:** En ciclo menor (PK–2do), las preguntas se simplifican o se hacen mediante conversación grupal guiada.

---

## Encuesta a apoderados

### Bloque 1 — Situación actual

1. ¿En qué ciclo está su hijo/a? (PK–2do / 3ro–6to / 7mo–IVmedio)
2. ¿Su hijo/a participa en talleres deportivos del colegio? (Sí / No / No sabe que existen)
3. ¿Su hijo/a participa en selecciones del colegio? (Sí / No / Le gustaría pero no ha podido)
4. ¿Qué nota le pone al deporte del colegio hoy? (1 a 7) ¿Por qué? (respuesta abierta)
5. ¿Qué es lo que más valora del área deportiva actual?
6. ¿Qué es lo que más le falta o le decepciona?

### Bloque 2 — Deporte fuera del colegio (mapa de fuga)

7. ¿Su hijo/a practica deporte fuera del colegio? (Sí / No)
8. Si sí: ¿Qué deporte y dónde? (academia, club, clases particulares)
9. ¿Por qué eligió hacerlo fuera del colegio y no dentro?
10. ¿Cuánto gastan aproximadamente al mes en deporte externo? (0 / hasta $50.000 / $50.000–$100.000 / $100.000–$200.000 / más de $200.000)
11. ¿Qué tendría que ofrecer el colegio para que prefirieran hacerlo acá?

### Bloque 3 — Demanda y expectativas

12. ¿Qué deportes o actividades le gustaría que el colegio ofreciera y hoy no ofrece?
13. ¿Le interesaría que el colegio tuviera programas deportivos más competitivos? (selecciones más fuertes, más torneos)
14. ¿Le interesaría que el colegio tuviera programas deportivos más recreativos? (más opciones, menos presión)
15. ¿Conoce la oferta deportiva de otros colegios de la zona? ¿Qué ofrecen que este colegio no?

### Bloque 4 — Comunidad (insumo para Área 6)

16. ¿Le interesaría participar usted en actividades deportivas organizadas por el colegio? (Sí / Tal vez / No)
17. Si sí: ¿Qué actividad? (running, yoga, fútbol, tenis, acondicionamiento físico, otro)
18. ¿En qué horario? (mañana temprano antes de clases / tarde después de clases / sábado mañana)
19. ¿Participaría en eventos deportivos familiares? (corridas, torneos padres-hijos, jornadas al aire libre)
20. ¿Estaría dispuesto/a a pagar una cuota mensual por un programa deportivo para adultos en el colegio? (Sí / Depende del monto / No)

---

## Encuesta a alumnos

### Ciclo menor (PK a 2do básico) — Conversación grupal guiada
- ¿Qué es lo que más les gusta de educación física?
- ¿Qué deporte les gustaría aprender?
- ¿Se divierten en las clases? ¿Qué los aburre?

### Ciclo medio (3ro a 6to básico)
1. ¿Qué deporte te gustaría que existiera o creciera en el colegio?
2. ¿Participas en algún taller o selección? ¿Te gusta?
3. ¿Qué te motiva de las clases de educación física?
4. ¿Qué te desmotiva o te aburre?
5. ¿Haces deporte fuera del colegio? ¿Cuál y dónde?
6. ¿Qué nota le pondrías al deporte del colegio? (1 a 7)

### Ciclo mayor (7mo básico a IV medio)
1. ¿Qué deporte te gustaría que existiera o creciera en el colegio?
2. ¿Participas en talleres o selecciones? ¿Por qué sí o por qué no?
3. ¿Qué te motiva o desmotiva de las clases y talleres actuales?
4. ¿Qué opinión tienes del nivel deportivo del colegio comparado con otros?
5. ¿Haces deporte fuera del colegio? ¿Cuál, dónde y por qué afuera?
6. ¿Qué te falta para entrenar y competir mejor? (solo seleccionados)
7. ¿Qué cambiarías del deporte en el colegio si pudieras?
8. ¿Te interesaría participar en organización de eventos deportivos, arbitraje, u otro rol no-jugador?

---

## Salida esperada

- **Mapa de fuga:** Cuántas familias consumen deporte afuera, en qué disciplinas y cuánto gastan. Esto dimensiona la oportunidad.
- **Lista de demanda no cubierta:** Deportes y formatos que las familias piden y el colegio no ofrece. Insumo directo para nivel Desarrollo y Comunidad.
- **Índice de satisfacción actual:** Nota promedio por ciclo. Línea base para medir progreso.
- **Potencial de comunidad:** Porcentaje de apoderados interesados en programas propios. Si supera el 20%, hay masa crítica para lanzar Área 6.
- **Brecha competitiva percibida:** Qué ven las familias en otros colegios que acá no existe.`},
"pauta-entrevista-direccion":{title:"Entrevista a dirección y rectoría",sectionId:"01",md:`Objetivo: entender qué espera el colegio del deporte antes de proponer nada.
Esta conversación es el insumo más importante de la Fase 1 (Institucional) del diagnóstico.

---

## Logística de la reunión

- **Duración:** 60–90 minutos. No apurar; si se extiende, mejor.
- **Quiénes deben estar:** Rector/a, Director/a Académico/a, y si existe, Director/a de Formación o Convivencia. Idealmente juntos para observar dinámicas internas.
- **Formato:** Conversación guiada, no cuestionario. Llevar las preguntas como guía mental, no leerlas en voz alta.
- **Registro:** Tomar notas a mano o en laptop, pedir permiso si se quiere grabar. No grabar sin consentimiento.
- **Lugar:** Oficina de ellos. Ir a su territorio demuestra respeto.
- **Antes de empezar:** Agradecer el espacio, explicar que el objetivo es escuchar para diseñar algo a la medida del colegio, no traer un modelo enlatado.

---

## Preguntas — Visión y estrategia

1. Cuando piensan en el deporte del colegio en 5 años, ¿qué les gustaría ver?
2. ¿Qué rol juega el deporte en la promesa que le hacen a las familias?
3. ¿Cómo se conecta el deporte con el proyecto educativo institucional (PEI)?
4. ¿Qué valores o sellos formativos esperan que el deporte refuerce?
5. ¿Existe un plan estratégico institucional y dónde aparece (o no) el deporte?

## Preguntas — Lo que funciona y lo que no

6. ¿Qué está funcionando bien hoy y no hay que tocar?
7. ¿Qué resultados deportivos les importan de verdad y cuáles no?
8. ¿Qué conflictos históricos ha tenido el área? (horarios, canchas, viajes, apoderados)
9. ¿Ha habido intentos anteriores de reestructurar el deporte? ¿Qué pasó?
10. ¿Qué consideran innegociable del área deportiva actual?

## Preguntas — Presupuesto y recursos

11. ¿Cuánta prioridad tiene el deporte frente a lo académico en horario y recursos?
12. ¿Cuál es el presupuesto anual aproximado del área y quién lo aprueba?
13. ¿El presupuesto deportivo es fijo o hay que justificarlo cada año?
14. ¿Existe disposición a invertir si se presenta un plan con indicadores claros?
15. ¿Cómo se financian hoy los viajes, inscripciones y equipamiento?

## Preguntas — Tecnología y herramientas

16. ¿Qué plataformas tecnológicas usa el colegio hoy? (LMS, comunicación con familias, gestión interna)
17. ¿Estarían abiertos a incorporar herramientas digitales en el área deportiva? (planificación, métricas, comunicación)
18. ¿Existe resistencia institucional al uso de tecnología o es un valor del colegio?

## Preguntas — Comunidad y familias

19. ¿Qué esperan del deporte para apoderados y staff?
20. ¿El Centro de Padres tiene opinión sobre el deporte? ¿Cuál?
21. ¿Han recibido quejas o sugerencias recurrentes de familias sobre el área?
22. ¿Ven al deporte como herramienta de retención de familias o de captación de matrícula?

## Preguntas — Medición de éxito

23. ¿Cómo miden hoy si el área deportiva lo está haciendo bien?
24. ¿Existen indicadores formales o es más bien una percepción general?
25. ¿Qué significaría para ustedes que esto fuera un éxito en un año?
26. ¿Y en tres años?

---

## Registrar después de la reunión

- **Expectativas explícitas vs implícitas:** Lo que dijeron con palabras vs lo que se lee en el tono y las prioridades.
- **Palabras que usan ellos:** Adoptar su lenguaje en las propuestas posteriores.
- **Semáforo:** Qué urge (rojo), qué importa (amarillo), qué puede esperar (verde).
- **Alineamiento interno:** ¿Los directivos estaban alineados entre sí o hay visiones diferentes?
- **Nivel de autonomía que ofrecen:** ¿Quieren participar en todo o delegar y que les reporten?

---

## Tips para leer entre líneas

- Si repiten "siempre lo hemos hecho así" --> hay resistencia al cambio. Ir con cuidado.
- Si mencionan un nombre propio varias veces (positiva o negativamente) --> esa persona es clave. Entrevistarla con atención.
- Si evitan hablar de presupuesto --> puede ser que no hay o que no quieren comprometerse. No presionar; volver al tema después con datos.
- Si comparan con otro colegio --> eso revela su aspiración real. Anotarlo.
- Si dicen "lo que tú propongas" demasiado rápido --> puede ser desinterés disfrazado de confianza. Validar con preguntas concretas.
- Si hay tensión entre académico y deportivo --> ese es el problema número uno a resolver antes de cualquier plan.
- Ojo con el lenguaje corporal cuando se habla de personas del equipo deportivo actual. Dice más que las palabras.`},
"pauta-entrevista-docentes":{title:"Entrevista a docentes y entrenadores",sectionId:"01",md:`Objetivo: conocer al equipo antes de evaluar. Escuchar primero, opinar después.
Insumo directo para la Fase 2 (Personas) del diagnóstico y para la clasificación especialista / en-proyección del Plan Maestro.

---

## Logística de la entrevista

- **Duración:** 30–45 minutos por persona. No agrupar; la conversación individual es más honesta.
- **Quién entrevista:** Solo el coordinador/jefe de área nuevo. Sin directivos presentes.
- **Formato:** Conversación, no interrogatorio. Empezar por su historia, no por sus problemas.
- **Confidencialidad:** Dejar claro que lo que digan no se reporta textual a dirección. Se usan los datos en forma agregada.
- **Orden sugerido:** Empezar por los más antiguos (tienen más contexto) y terminar por los más nuevos (tienen menos filtro).
- **Registro:** Notas breves durante la conversación. Completar la ficha de señales inmediatamente después, no al final del día.

---

## Preguntas — Historia y rol actual

1. Cuéntame tu historia en el colegio y cómo llegaste a tu rol actual.
2. ¿Cuál es tu formación profesional? (título, especialidad deportiva, certificaciones)
3. ¿Qué cursos, talleres y selecciones tienes a cargo hoy?
4. ¿Cuántas horas semanales tienes contratadas y cómo se distribuyen?

## Preguntas — Planificación y metodología

5. ¿Cómo planificas tus clases o entrenamientos hoy? (anual, semestral, semanal, improvisado)
6. ¿Usas algún formato o plantilla de planificación?
7. ¿Cómo adaptas las clases cuando tienes niveles muy distintos en un mismo grupo?
8. ¿Llevas registro de asistencia, progreso o rendimiento de tus alumnos?

## Preguntas — Evaluación

9. ¿Qué evaluaciones aplicas a tus alumnos y con qué frecuencia?
10. ¿Qué haces con los datos de evaluación? ¿Los analizas, los guardas, los compartes?
11. ¿Conoces o has usado rúbricas, test estandarizados, o evaluaciones formativas en deporte?
12. Si pudieras diseñar tu sistema de evaluación ideal, ¿cómo sería?

## Preguntas — Tecnología

13. ¿Qué herramientas tecnológicas usas hoy en tu trabajo? (apps, planillas, plataformas)
14. ¿Te sentirías cómodo/a usando una plataforma digital para planificar y reportar?
15. ¿Usas video, cronometraje digital, o alguna herramienta de análisis con tus alumnos?

## Preguntas — Relación con familias y comunidad

16. ¿Tienes contacto directo con apoderados? ¿Cómo y con qué frecuencia?
17. ¿Cómo manejas las expectativas de los papás respecto al rendimiento deportivo de sus hijos?
18. ¿Has participado o participarías en programas deportivos para la comunidad escolar (apoderados, funcionarios)?

## Preguntas — Desarrollo profesional

19. ¿Qué capacitación has recibido en los últimos dos años?
20. ¿Qué te gustaría aprender o en qué te gustaría especializarte?
21. ¿Estarías dispuesto/a a certificarte en algún deporte o metodología si el colegio lo financia?

## Preguntas — Percepción y propuestas

22. ¿Qué es lo que mejor funciona del área hoy?
23. ¿Qué te frustra o te frena para hacer mejor tu trabajo?
24. ¿Qué opinas del nivel deportivo del colegio frente a otros de la zona?
25. ¿Qué necesitarías para dar un salto de calidad?
26. Si pudieras cambiar una sola cosa del área, ¿cuál sería?
27. ¿Dónde te ves aportando más en un proyecto nuevo?

---

## Señales a registrar (completar inmediatamente después de cada entrevista)

| Dimensión | Indicadores | Nivel (alto/medio/bajo) |
|---|---|---|
| Disposición al cambio | Apertura a nuevas ideas, flexibilidad, lenguaje propositivo vs defensivo | |
| Nivel técnico real | Dominio de su disciplina, capacidad de enseñar progresiones, vocabulario técnico | |
| Capacidad de planificación | Planifica con anticipación, documenta, tiene estructura | |
| Liderazgo natural | Otros lo mencionan, propone soluciones, se ofrece para más | |
| Manejo tecnológico | Usa herramientas, disposición a aprender nuevas | |
| Relación con alumnos | Los alumnos lo buscan, genera clima positivo, maneja conflictos | |

---

## Clasificación según Plan Maestro

Después de todas las entrevistas, clasificar a cada persona:

**Especialista:** Tiene título o certificación en su deporte, experiencia competitiva o formativa demostrable, planifica con método, evalúa con criterio, se actualiza. Puede liderar un deporte de forma autónoma.

**En-proyección:** Tiene potencial y disposición pero le falta formación específica, experiencia competitiva o herramientas metodológicas. Necesita acompañamiento, mentoría y un plan de desarrollo para llegar a nivel especialista en 1–2 años.

Registrar para cada persona:
- Clasificación actual (especialista / en-proyección)
- Brecha principal (¿qué le falta?)
- Plan sugerido (capacitación, mentoría, cambio de rol)
- Plazo estimado para cerrar la brecha

---

## Regla de oro

Ninguna promesa individual en estas conversaciones. Solo escuchar y agradecer.
No anticipar cambios de estructura, roles ni horarios. Todo se comunica después, con plan completo.`},
"baterias-evaluacion":{title:"Baterías de evaluación física",sectionId:"02",md:`Batería basada en ALPHA-Fitness (Ruiz et al., 2011) con adaptaciones para el contexto escolar chileno. No se inventa nada: se usa lo que la evidencia ya validó.

## Criterios para elegir tests

- **Aplicables en una clase normal** con el material disponible en el colegio
- **Comparables año a año.** Misma batería, mismas condiciones, mismo protocolo
- **Con valores de referencia por edad** cuando existan
- **Seguros para la edad.** Nada de máximos en ciclos menores
- **Rápidos de aplicar.** Una medición completa no debería tomar más de 2 clases por curso

## Ciclo 1: Prekinder a 2do básico (5 a 7 años)

| Capacidad | Test | Material |
|-----------|------|----------|
| Coordinación | Circuito coordinativo (4 estaciones) | Conos, colchonetas, cuerda |
| Equilibrio | Equilibrio unipodal (tiempo máximo) | Cronómetro |
| Velocidad | Carrera 10 metros | Cronómetro, conos |
| Flexibilidad | Sit and reach adaptado | Cajón o banco |
| Lateralidad | Dominancia funcional (3 tareas) | Pelota, aro |

Nota: los tests son lúdicos. Se presentan como juegos, no como pruebas.

## Ciclo 2: 3ro a 6to básico (8 a 11 años)

| Capacidad | Test | Material |
|-----------|------|----------|
| Fuerza tren inferior | Salto horizontal a pies juntos | Cinta métrica |
| Velocidad | Carrera 20 metros | Cronómetro, conos |
| Agilidad | Test 4x10 metros | Cronómetro, esponjas, conos |
| Resistencia | Course Navette 20m | Parlante, audio oficial |
| Flexibilidad | Sit and reach | Cajón estandarizado |
| Coordinación | Circuito ALPHA adaptado | Balón, conos |

Valores de referencia: tablas de percentiles ALPHA-Fitness por edad y sexo.

## Ciclo 3: 7mo básico a I medio (12 a 14 años)

| Capacidad | Test | Material |
|-----------|------|----------|
| Fuerza tren inferior | Salto horizontal | Cinta métrica |
| Fuerza tren superior | Lanzamiento balón medicinal 3kg | Balón medicinal, cinta |
| Velocidad | Carrera 20 metros | Cronómetro, conos |
| Agilidad | Test 4x10 metros | Cronómetro, conos |
| Resistencia | Course Navette 20m | Parlante, audio oficial |
| Flexibilidad | Sit and reach | Cajón estandarizado |

## Ciclo 4: II a IV medio (15 a 17 años)

| Capacidad | Test | Material |
|-----------|------|----------|
| Fuerza tren inferior | Salto horizontal + sentadilla isométrica | Cinta, cronómetro, pared |
| Fuerza tren superior | Lanzamiento balón medicinal + flexiones 30seg | Balón medicinal, cinta |
| Velocidad | Carrera 20 metros | Cronómetro |
| Agilidad | Test 4x10 + test T modificado | Cronómetro, conos |
| Resistencia | Course Navette 20m | Parlante, audio oficial |
| Flexibilidad | Sit and reach | Cajón estandarizado |
| Composición corporal | IMC + perímetro de cintura | Balanza, tallímetro, cinta |

## Protocolo de aplicación

### Antes de la medición
1. Informar a los alumnos con una semana de anticipación
2. Vestimenta deportiva obligatoria
3. No aplicar después de clases de alta intensidad
4. Tener fichas de registro preparadas

### Durante la medición
1. Calentamiento estandarizado de 10 minutos (el mismo siempre)
2. Explicar y demostrar cada test antes de ejecutar
3. Permitir un intento de práctica antes del oficial
4. Registrar el mejor de 2 intentos (excepto resistencia: 1 intento)
5. No presionar ni gritar tiempos en voz alta frente al grupo

### Después de la medición
1. Cargar datos en plataforma dentro de la misma semana
2. Verificar datos atípicos (errores de registro son comunes)
3. No publicar rankings entre alumnos

## Calendario de medición

| Período | Fecha sugerida | Propósito |
|---------|---------------|-----------|
| Medición de entrada | Semanas 2-3 de marzo | Línea base del año |
| Medición de salida | Semanas 2-3 de octubre | Comparación con entrada |
| Seleccionados (opcional) | Agosto | Seguimiento nivel Elite |

## Material mínimo necesario
- Cronómetros (al menos 2 por docente)
- Cinta métrica (15-20 metros)
- Conos (set de 20)
- Cajón de sit and reach
- Balón medicinal 3kg (2 unidades)
- Parlante + audio oficial Course Navette
- Colchonetas (circuito ciclo 1)
- Balanza y tallímetro (ciclos 3 y 4)

**Inversión estimada:** la mayoría de los colegios ya tiene este material. Lo que suele faltar es el cajón de sit and reach (bajo costo) y el audio oficial del Navette (descargable gratis).

## Referencias
- Ruiz, J.R. et al. (2011). ALPHA health-related fitness test battery. [PDF gratis](https://profith.ugr.es/wp-content/uploads/2022/10/INGLES-1.pdf)
- Ortega, F.B. et al. (2008). Physical fitness as a marker of health. [Ver en Nature](https://www.nature.com/articles/0803774)`},
"perfil-atletico-estructura":{title:"Perfil del deportista - estructura",sectionId:"02",md:`El perfil atlético es el corazón del nivel Formación. Es lo que convierte la clase de educación física de "una hora de deporte" en un sistema con datos, progresión y seguimiento real.

## Principios del perfil

- **Se co-construye con el equipo.** No se llega con el documento cerrado. Se presenta una base y se ajusta con los docentes.
- **Es medible o no sirve.** Cada dimensión debe tener al menos un indicador cuantificable.
- **Es longitudinal.** El valor está en la película completa, no en una foto puntual.
- **No compara entre alumnos.** El reporte muestra progreso del alumno contra sí mismo.
- **Se adapta por ciclo.** Lo que se mide y cómo se mide cambia según la edad.

## Dimensiones del perfil

### 1. Capacidades motrices básicas
Coordinación, equilibrio, lateralidad, ritmo, orientación espacial y temporal.
**Indicadores:** circuito coordinativo, test de equilibrio, lateralidad funcional.

### 2. Capacidades físicas condicionales
Fuerza, velocidad, resistencia aeróbica, flexibilidad.
**Indicadores:** salto horizontal, velocidad 20m, Course Navette, sit and reach, lanzamiento balón medicinal.

### 3. Habilidades deportivas transversales
Lanzar, atrapar, golpear, patear, saltar, girar, nadar (si aplica).
**Indicadores:** rúbrica de competencia motriz, test de precisión, evaluación de nado básico.

### 4. Dimensión cognitiva y táctica
Lectura de juego, toma de decisiones, comprensión de reglas y estrategias.
**Indicadores:** rúbrica de observación en juego (GPAI adaptado), autoevaluación en categorías mayores.

### 5. Dimensión actitudinal y social
Esfuerzo, perseverancia, trabajo en equipo, juego limpio, respeto, autonomía.
**Indicadores:** rúbrica actitudinal con descriptores de conducta por nivel.

## Organización por ciclo

### Ciclo 1: Prekinder a 2do básico (5 a 7 años)
**Foco:** desarrollo motor y juego

| Dimensión | Peso | Evaluación |
|-----------|------|-----------|
| Motrices básicas | 40% | Circuito + observación |
| Físicas condicionales | 15% | Tests adaptados |
| Habilidades transversales | 25% | Rúbrica |
| Cognitiva/táctica | 5% | Observación en juego |
| Actitudinal | 15% | Rúbrica de conducta |

### Ciclo 2: 3ro a 6to básico (8 a 11 años)
**Foco:** multideporte y habilidades transversales

| Dimensión | Peso | Evaluación |
|-----------|------|-----------|
| Motrices básicas | 20% | Circuito coordinativo |
| Físicas condicionales | 25% | Batería ALPHA adaptada |
| Habilidades transversales | 25% | Tests + rúbrica |
| Cognitiva/táctica | 15% | Observación en juego |
| Actitudinal | 15% | Rúbrica de conducta |

### Ciclo 3: 7mo básico a I medio (12 a 14 años)
**Foco:** orientación deportiva y desarrollo

| Dimensión | Peso | Evaluación |
|-----------|------|-----------|
| Motrices básicas | 10% | Integrada en deportes |
| Físicas condicionales | 30% | Batería ALPHA completa |
| Habilidades deportivas | 25% | Evaluación por deporte |
| Cognitiva/táctica | 20% | GPAI + autoevaluación |
| Actitudinal | 15% | Rúbrica + autoevaluación |

### Ciclo 4: II a IV medio (15 a 17 años)
**Foco:** consolidación, especialización y proyección

| Dimensión | Peso | Evaluación |
|-----------|------|-----------|
| Físicas condicionales | 30% | Batería completa |
| Habilidades deportivas | 25% | Evaluación específica |
| Cognitiva/táctica | 20% | Análisis de juego |
| Actitudinal/liderazgo | 15% | Rúbrica + autoevaluación |
| Autonomía y hábitos | 10% | Evaluación programa propio |

## Perfil de egreso

Un alumno que egresa de IV medio debería poder:
1. **Físicamente:** mantener condición física saludable y saber autoevaluarse
2. **Deportivamente:** practicar al menos un deporte con competencia técnica básica
3. **Tácticamente:** leer situaciones de juego y tomar decisiones
4. **Actitudinalmente:** competir con juego limpio y tolerar la frustración
5. **Autónomamente:** diseñar y ejecutar una rutina de actividad física sin depender de un profesor

Este perfil se presenta a las familias desde el primer año. Es la promesa del área.

## Implementación
1. Presentar esta estructura al equipo como borrador
2. Ajustar con los docentes que conocen la realidad de cada ciclo
3. Validar con rectoría la versión co-construida
4. Pilotear en un ciclo durante el primer semestre (Ciclo 2 por volumen y edad)
5. Ajustar y escalar al resto en el segundo semestre o año 2`},
"rubrica-medicion":{title:"Rúbricas y reporte de avance",sectionId:"02",md:`Las rúbricas traducen los datos del perfil atlético en un lenguaje que el docente puede usar para evaluar y que la familia puede entender.

## Niveles generales

| Nivel | Descriptor | Color |
|-------|-----------|-------|
| 1 - En desarrollo inicial | Está construyendo las bases | Rojo suave |
| 2 - En progreso | Avanza pero no alcanza lo esperado | Amarillo |
| 3 - Logrado | Cumple lo esperado para su edad | Verde |
| 4 - Destacado | Supera lo esperado. Candidato a Desarrollo/Elite | Azul |

## Ejemplo: rúbrica capacidades físicas - Ciclo 2

| Capacidad | Nivel 1 | Nivel 2 | Nivel 3 | Nivel 4 |
|-----------|---------|---------|---------|---------|
| Salto horizontal | Bajo percentil 20 | Percentil 20-40 | Percentil 40-70 | Sobre percentil 70 |
| Velocidad 20m | Bajo percentil 20 | Percentil 20-40 | Percentil 40-70 | Sobre percentil 70 |
| Resistencia | Bajo percentil 20 | Percentil 20-40 | Percentil 40-70 | Sobre percentil 70 |
| Flexibilidad | Bajo percentil 20 | Percentil 20-40 | Percentil 40-70 | Sobre percentil 70 |

Percentiles de tablas ALPHA-Fitness ajustadas por edad y sexo.

## Ejemplo: rúbrica actitudinal (todos los ciclos)

| Indicador | Nivel 1 | Nivel 2 | Nivel 3 | Nivel 4 |
|-----------|---------|---------|---------|---------|
| Esfuerzo | Participa solo si se le insiste | Participa pero abandona rápido | Se esfuerza de manera consistente | Se esfuerza al máximo y motiva a otros |
| Trabajo en equipo | Le cuesta integrarse | Se integra pero no colabora | Colabora y acepta roles | Lidera positivamente |
| Juego limpio | Hace trampa o no acepta reglas | Acepta reglas pero protesta | Respeta reglas y decisiones | Promueve el juego limpio |
| Perseverancia | No intenta cuando algo le cuesta | Intenta pero se frustra | Sigue intentando | Busca formas alternativas de superar |

## Reporte al apoderado

### Frecuencia
Dos veces al año:
- **Junio:** basado en medición de entrada + observación primer semestre
- **Noviembre:** basado en medición de salida + observación anual completa

### Formato (UNA página)
1. **Perfil general (gráfico radar):** las 5 dimensiones del perfil con comparación si existe
2. **Detalle por dimensión:** nivel alcanzado + flecha de tendencia + comentario del docente
3. **Sugerencias:** 2-3 sugerencias concretas y positivas
4. **Datos físicos (ciclo 2+):** resultados de cada test con percentil de referencia

### Reglas del reporte
1. Foco en el avance personal, no en la posición relativa
2. Sin comparaciones entre alumnos. Nunca "está por debajo de la media"
3. Lenguaje positivo y propositivo. "Puede mejorar con..." no "tiene baja..."
4. El docente firma el reporte y está disponible para conversar
5. Datos sensibles (peso, IMC) NO van sin protocolo específico

## Uso interno de los datos

### Para el docente
- Identificar alumnos que necesitan más apoyo (nivel 1 persistente)
- Identificar candidatos a Desarrollo o Elite (nivel 4 consistente)
- Ajustar planificación según resultados del curso

### Para la jefatura
- Promedios por curso para detectar intervenciones necesarias
- Tendencias por ciclo para verificar coherencia
- Cobertura: porcentaje evaluados vs matrícula
- Detección de talento para invitar a talleres y ramas

### Para rectoría (datos agregados)
- Distribución de alumnos por nivel en cada dimensión
- Porcentaje de mejora entre mediciones
- Comparación año a año (desde el segundo año)
- Alimenta el informe semestral y anual (ver documento de KPIs)

## Implementación
- **Año 1:** piloto en Ciclo 2, reporte simplificado, recoger feedback
- **Año 2:** todos los ciclos, reporte completo con gráfico radar, primer dato longitudinal
- **Año 3:** sistema consolidado, datos de 3 mediciones, diferenciador del colegio`},
"evaluacion-docente":{title:"Evaluación y acompañamiento docente",sectionId:"03",md:`## Principio rector
La evaluación existe para desarrollar personas, no para pillarlas.
Todo se conversa cara a cara y con evidencia. La observación formativa es frecuente y de bajo riesgo; la evaluación sumativa ocurre una vez al año y sin sorpresas.

## Ciclo anual detallado

| Mes | Actividad | Responsable |
|-----|-----------|-------------|
| Marzo | Acuerdo de metas individuales alineadas a KPIs del área. Cada docente recibe su plan de desarrollo con foco en máximo 2 competencias. | Jefe de Departamento |
| Abril | Primera observación formativa (sin nota). Se completa la pauta y se conversa en 48 horas. | Jefe o Coordinador |
| Mayo | Autoevaluación docente: cada profesor completa su ficha con evidencia propia. | Docente |
| Junio | Segunda observación formativa. Se aplica encuesta breve a estudiantes (3 preguntas). | Jefe o Coordinador |
| Julio | Retroalimentación de medio año: conversación individual con acta. Se ajustan metas si es necesario. | Jefe de Departamento |
| Agosto | Tercera observación formativa (puede ser entre pares). | Par asignado |
| Septiembre | Revisión de avance del plan de desarrollo individual. | Jefe de Departamento |
| Octubre | Observación sumativa con la pauta completa. Esta sí genera calificación. | Jefe de Departamento |
| Noviembre | Evaluación de cierre: se reúne toda la evidencia (observaciones, autoevaluación, encuesta estudiantes, resultados de aprendizaje). | Jefe de Departamento |
| Diciembre | Conversación de cierre y acuerdo del plan del año siguiente. Se define si el docente mantiene su clasificación o avanza. | Jefe de Departamento |

## Diferencia entre observación formativa y evaluación sumativa
- **Formativa**: ocurre 3-4 veces al año, no lleva calificación, su propósito es retroalimentar y acompañar. El docente elige una de las visitas. El foco puede ser una sola dimensión.
- **Sumativa**: ocurre 1 vez al año (octubre), usa la pauta completa, genera una calificación global y alimenta decisiones de continuidad y desarrollo.

## Pauta de observación — rúbrica por dimensiones

Cada dimensión se evalúa en 4 niveles: Inicial (1), En desarrollo (2), Competente (3), Destacado (4).

### 1. Inicio, desarrollo y cierre de la sesión
- **Inicial**: no hay estructura clara; la clase comienza sin objetivo ni se cierra con síntesis.
- **En desarrollo**: hay objetivo comunicado pero el cierre es débil o inexistente.
- **Competente**: la clase tiene inicio motivador, desarrollo coherente y cierre con reflexión o síntesis.
- **Destacado**: además conecta con sesiones anteriores, anticipa la siguiente y el cierre incluye autoevaluación del alumno.

### 2. Tiempo de actividad motriz real
- **Inicial**: menos del 40 % del tiempo los alumnos están en movimiento.
- **En desarrollo**: entre 40 % y 55 % de tiempo activo.
- **Competente**: entre 55 % y 70 % de tiempo activo, con transiciones breves.
- **Destacado**: más del 70 % de tiempo activo; las explicaciones ocurren en movimiento o son muy breves.

### 3. Progresión y adaptación por niveles
- **Inicial**: una sola tarea igual para todos, sin variación.
- **En desarrollo**: ofrece una variante más fácil o más difícil, pero sin criterio claro.
- **Competente**: presenta al menos 3 niveles de dificultad y los alumnos pueden elegir o son asignados.
- **Destacado**: la progresión está planificada, usa datos previos y el docente ajusta en tiempo real.

### 4. Clima y trato
- **Inicial**: tono autoritario, poco contacto visual, uso de ironía o comparaciones.
- **En desarrollo**: trato correcto pero distante; no conoce los nombres de todos.
- **Competente**: ambiente de confianza, refuerzo positivo específico, conoce a cada alumno.
- **Destacado**: genera pertenencia, los alumnos se corrigen entre sí con respeto, el error es parte del aprendizaje.

### 5. Seguridad
- **Inicial**: no revisa el espacio antes de la clase, no tiene protocolo de emergencia visible.
- **En desarrollo**: revisa el espacio pero no adapta la actividad a riesgos detectados.
- **Competente**: revisa espacio, adapta actividad, tiene botiquín accesible y conoce el protocolo.
- **Destacado**: además enseña a los alumnos a identificar riesgos y actuar ante una emergencia.

## Componente de autoevaluación
Cada docente completa en mayo una ficha donde:
1. Evalúa su propio desempeño en las 5 dimensiones con la misma rúbrica.
2. Adjunta una evidencia por dimensión (video corto, planificación, registro fotográfico).
3. Identifica su principal logro del semestre y su principal desafío.
4. Propone una acción concreta para el segundo semestre.

La autoevaluación no se califica; se usa como insumo para la conversación de julio.

## Encuesta a estudiantes
Se aplica en junio (y opcionalmente en noviembre) con 3 preguntas adaptadas al ciclo:
- "¿Tu profesor te explica bien lo que van a hacer en clase?" (claridad)
- "¿Sientes que tu profesor se preocupa por ti?" (vínculo)
- "¿La clase de educación física te gusta?" (motivación)

Formato: carita feliz / neutra / triste en ciclo inicial; escala 1-5 en ciclo medio y superior.
Los resultados se entregan al docente como tendencia, nunca como dato individual de un alumno.

## Conexión con el plan de desarrollo profesional
- La evaluación de cierre define las 2 competencias foco del año siguiente.
- Si un docente está en nivel Inicial en alguna dimensión, se activa acompañamiento intensivo (observación quincenal + mentoría con un Especialista).
- Si un docente está Competente o Destacado en todas las dimensiones, se le propone rol de mentor o líder de proyecto interno.
- La clasificación Especialista / En Proyección se revisa anualmente con base en esta evaluación.

## Protocolos de conversación de retroalimentación

### Estructura de la conversación (30 minutos)
1. Abrir con un logro concreto observado (5 min).
2. Presentar la evidencia de la dimensión a trabajar (10 min).
3. Preguntar antes de decir: "¿Qué viste tú en ese momento?" (5 min).
4. Acordar juntos una acción concreta y medible (5 min).
5. Cerrar con fecha de seguimiento (5 min).

### Qué hacer con un docente resistente
- No insistir en la primera conversación. Escuchar sus razones.
- En la segunda conversación, llevar datos (no opiniones): tiempos de actividad, resultados de encuesta.
- Si la resistencia persiste después de 3 conversaciones documentadas, elevar a rectoría con el registro completo.
- Nunca confrontar en público ni en reunión de equipo.

## Documentación requerida
- Acta de acuerdo de metas (marzo): firmada por ambas partes.
- Pauta de observación completada por visita (mínimo 4 al año).
- Ficha de autoevaluación (mayo).
- Resultados de encuesta a estudiantes (junio).
- Acta de retroalimentación de medio año (julio).
- Informe de evaluación de cierre (noviembre): incluye calificación global y plan siguiente.
- Toda la documentación se guarda en carpeta digital compartida con el docente.`},
"gestion-del-cambio":{title:"Gestión del cambio con el equipo",sectionId:"03",md:`El proyecto se socializa, no se impone. Heredar un equipo exige método, paciencia y lectura política. La velocidad del cambio la marca el equipo, no el jefe nuevo.

## Playbook mes a mes — primeros 6 meses

### Mes 1: Escuchar
- Entrevistas individuales con cada integrante del equipo (45 min cada una).
- Preguntas clave: "¿Qué funciona bien hoy?", "¿Qué te frustra?", "¿Qué necesitas para hacer mejor tu trabajo?"
- Cero anuncios de cambios. Cero documentos nuevos. Cero reorganización.
- Observar clases sin pauta formal: ir a ver, agradecer y no opinar aún.
- Registrar en privado: fortalezas del equipo, dolores recurrentes, líderes naturales, posibles resistencias.
- Formato de reunión: solo una reunión general breve (30 min) para presentarse y explicar que el primer mes es de escucha.

### Mes 2: Devolver
- Presentar al equipo un resumen honesto de lo escuchado (sin atribuir frases a personas).
- Reconocer explícitamente lo bueno que existe: "Esto ya funciona y lo vamos a mantener."
- Plantear 2-3 preguntas abiertas: "¿Qué les gustaría que fuera distinto el próximo año?"
- Formato de reunión: taller de 90 minutos con papelógrafo. No PowerPoint.
- Identificar públicamente a 2-3 aliados y pedirles que lideren una mesa de trabajo.

### Mes 3: Co-construir
- Trabajar con el equipo en la definición del perfil del deportista del colegio.
- Armar juntos el calendario deportivo y los criterios de evaluación del alumno.
- Cada docente propone una meta personal para el semestre siguiente.
- Formato de reunión: 2 sesiones de trabajo de 60 minutos con producto concreto (documento borrador).
- Regla: todo lo que se decida se escribe. Lo que no se escribe, no existe.

### Mes 4: Formalizar
- Presentar la versión final de roles, metas e indicadores por escrito.
- Cada persona firma su acuerdo de desempeño (no como amenaza, sino como claridad).
- Se instala la reunión semanal de área con formato fijo (ver abajo).
- Formato de reunión: reunión formal de 45 minutos con acta.

### Mes 5: Primeras victorias
- Ejecutar al menos una acción visible que el equipo pidió (mejora de implementos, ajuste de horario, acceso a capacitación).
- Celebrar públicamente un logro del equipo (no del jefe).
- Compartir un dato positivo: asistencia, encuesta de alumnos, participación en torneo.
- Formato de reunión: reunión semanal normal + un espacio de 15 minutos para reconocimiento.

### Mes 6: Evaluar y ajustar
- Revisar con el equipo: "¿Qué ha funcionado de los cambios? ¿Qué hay que ajustar?"
- Aplicar una encuesta anónima breve al equipo (5 preguntas sobre clima, claridad de rol, apoyo).
- Ajustar lo que no sirve sin ego. Decirlo en voz alta: "Esto no funcionó, lo cambiamos."
- Formato de reunión: taller de retroalimentación de 60 minutos.

## Estrategia de comunicación

### Qué decir
- "Vengo a sumar, no a reemplazar lo que funciona."
- "Necesito conocer antes de opinar."
- "Las decisiones las vamos a tomar con datos y en conjunto."
- "Mi trabajo es que ustedes tengan las condiciones para hacer bien el suyo."

### Qué NO decir
- "En mi colegio anterior hacíamos esto..." (comparación).
- "Esto va a cambiar todo" (amenaza implícita).
- "La rectoría me pidió ordenar esto" (delegación de autoridad).
- "Ya tengo el plan listo" (imposición).
- Nunca hablar mal de la gestión anterior, aunque haya sido deficiente.

### Cuándo comunicar
- Los cambios se anuncian en reunión presencial, nunca por correo ni por WhatsApp.
- Primero se conversa individualmente con los más afectados, luego se comunica al grupo.
- Los cambios de horario o carga se anticipan con al menos 2 semanas.

## Arquetipos del equipo y cómo manejarlos

### El entusiasta
- Perfil: se suma rápido, quiere liderar, a veces se adelanta.
- Riesgo: puede generar rechazo en los demás si se le da demasiado protagonismo temprano.
- Estrategia: darle un rol concreto y acotado. Pedirle que escuche a los otros antes de proponer.

### El escéptico
- Perfil: cuestiona todo, pide evidencia, tiene experiencia y la usa como escudo.
- Riesgo: puede contagiar al grupo si no se le responde con datos.
- Estrategia: involucrarlo temprano en el diagnóstico. Darle la tarea de verificar datos. Convertirlo en auditor interno del proceso.

### El veterano
- Perfil: lleva muchos años, tiene estatus informal, el equipo lo respeta.
- Riesgo: si se siente ignorado, puede bloquear el cambio sin decir nada.
- Estrategia: reunión individual antes de cualquier anuncio. Pedirle consejo explícitamente. Reconocer su trayectoria en público.

### El pasivo
- Perfil: no opina, no se opone, hace lo mínimo, espera instrucciones.
- Riesgo: puede parecer alineado pero no ejecuta los cambios.
- Estrategia: darle tareas pequeñas con plazo y seguimiento. Retroalimentar cada logro. No confundir silencio con acuerdo.

## Formato de reunión semanal de área
- Duración: 30 minutos máximo.
- Estructura fija: (1) revisión de compromisos pendientes — 10 min, (2) un tema de la semana — 15 min, (3) acuerdos y responsables — 5 min.
- Se escribe acta breve con los acuerdos. Se envía el mismo día.
- El jefe no habla más del 40 % del tiempo.

## Señales de que el cambio está funcionando
- Los docentes llegan preparados a la reunión semanal.
- Alguien del equipo propone una mejora sin que se la pidan.
- Los docentes se observan clases entre ellos voluntariamente.
- Bajan las quejas de apoderados o alumnos sobre la clase de EFI.
- El equipo usa el vocabulario del proyecto (perfil del deportista, rúbricas, etc.).

## Señales de que el cambio está fallando
- Las reuniones se cancelan o nadie participa.
- Los docentes siguen haciendo exactamente lo mismo que antes sin incorporar nada.
- Hay conversaciones de pasillo en contra del proyecto pero nadie las dice en reunión.
- El jefe siente que tiene que empujar todo solo.
- Rectoría recibe quejas del equipo sobre el nuevo liderazgo.

## Escalamiento cuando la resistencia es demasiado fuerte
1. Documentar con evidencia: fechas de conversaciones, acuerdos incumplidos, resultados de observación.
2. Tener una conversación directa y privada: "Noto que esto no está funcionando. ¿Qué necesitas?"
3. Si no hay cambio después de 2 conversaciones documentadas, involucrar a rectoría con un informe objetivo (datos, no opiniones).
4. Rectoría decide si interviene con una conversación formal, un plan de mejora con plazo, o una decisión de continuidad.
5. El jefe de departamento nunca amenaza ni toma decisiones contractuales por su cuenta.

## Cómo celebrar victorias tempranas
- Nombrar logros específicos en la reunión semanal: "Gracias a [nombre] por [acción concreta]."
- Enviar un correo a rectoría reconociendo al equipo (con copia al equipo).
- Compartir datos positivos en un formato visual simple (un gráfico, una foto).
- Organizar un desayuno o almuerzo informal después de un hito (primer torneo, primera evaluación aplicada).
- Nunca atribuirse logros del equipo. El jefe celebra lo que otros hicieron.`},
"matriz-competencias":{title:"Matriz de competencias del equipo",sectionId:"03",md:`Cruce entre lo que el proyecto necesita y lo que el equipo actual tiene. Se completa durante el primer trimestre y se actualiza anualmente. Es la base objetiva para decidir desarrollo, contrataciones y composición del equipo.

## Las 6 competencias — rúbrica completa

Cada competencia se evalúa en 4 niveles: Inicial (1), En desarrollo (2), Competente (3), Destacado (4).

### 1. Dominio técnico de su deporte o área
- **Inicial**: conocimiento básico; no puede demostrar ni corregir gestos técnicos con precisión.
- **En desarrollo**: domina los fundamentos pero tiene lagunas en progresiones avanzadas o en reglamento.
- **Competente**: domina técnica, táctica y reglamento; puede enseñar desde iniciación hasta nivel competitivo.
- **Destacado**: además se actualiza permanentemente, tiene certificaciones y puede formar a otros docentes en su área.
- *Evidencia*: observación de clase, certificaciones, historial deportivo, capacitaciones realizadas.

### 2. Planificación y uso de datos
- **Inicial**: no planifica por escrito o lo hace de forma genérica sin progresión.
- **En desarrollo**: planifica unidades pero no usa datos de evaluación para ajustar.
- **Competente**: planifica con progresión clara, usa rúbricas del perfil del deportista y ajusta según resultados.
- **Destacado**: además analiza tendencias entre cursos, comparte datos con el equipo y propone mejoras basadas en evidencia.
- *Evidencia*: planificaciones entregadas, registros de evaluación, informes de avance.

### 3. Manejo de grupo y clima de clase
- **Inicial**: pierde el control del grupo con frecuencia; recurre al grito o a la inactividad como castigo.
- **En desarrollo**: mantiene el orden pero con un estilo rígido que no genera disfrute.
- **Competente**: genera un ambiente de respeto y motivación; los alumnos participan activamente.
